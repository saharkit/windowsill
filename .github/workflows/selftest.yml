name: selftest

# least-privilege floor (infra#216 lens round): the publish-coverage-badge job is the one
# exception — it holds `contents: write` and only runs on a push to `main`, so a pull_request
# or merge_group run cannot spend the token; every other job inherits the read-only grant below.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  # the merge queue runs CI on a merge_group ref; without this trigger the queue's required check
  # would never report and every group would eject at the check-response timeout (infra#216)
  merge_group:
  workflow_dispatch:

jobs:
  shellcheck:
    name: scripts parse and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n every script
        run: for f in plugins/voice-loop/scripts/*.sh; do bash -n "$f" || exit 1; done
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning plugins/voice-loop/scripts/*.sh
      - name: plugin manifests are valid JSON
        run: |
          for f in .claude-plugin/marketplace.json plugins/voice-loop/.claude-plugin/plugin.json \
                   plugins/voice-loop/hooks/hooks.json plugins/sill-core/.claude-plugin/plugin.json \
                   plugins/agent-handbook/.claude-plugin/plugin.json plugins/agent-handbook/hooks/hooks.json \
                   plugins/agent-statusline/.claude-plugin/plugin.json; do
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f" || exit 1
          done

      - name: agent-handbook standing rules actually emit
        run: |
          set -euo pipefail
          # This script runs on every session start of everyone who installs the plugin, and by
          # design it fails silently — so without this step a renamed file or a broken strip ships
          # as a no-op nobody notices.
          out=$(node plugins/agent-handbook/hooks/emit-standing-rules.js)
          [ -n "$out" ] || { echo "the emitter produced nothing"; exit 1; }
          printf '%s' "$out" | grep -q "Stop when the stopping condition is met" \
            || { echo "a standing rule went missing from the emitted text"; exit 1; }
          printf '%s' "$out" | grep -q "From the agent-handbook plugin" \
            || { echo "the provenance line went missing"; exit 1; }
          # The front-matter strip fails OPEN: when it does not match, the YAML ships to every
          # session. These four are the ordinary edits that break the match.
          printf '%s' "$out" | grep -q "keep-coding-instructions" \
            && { echo "front matter leaked into the emitted context"; exit 1; }
          src=plugins/agent-handbook/output-styles/flagellant-rule.md
          cp "$src" /tmp/style-orig.md
          trap 'cp /tmp/style-orig.md "$src"' EXIT
          for mangle in bom blank fence crlf; do
            case "$mangle" in
              bom)   printf '\xef\xbb\xbf' > "$src"; cat /tmp/style-orig.md >> "$src" ;;
              blank) printf '\n\n' > "$src"; cat /tmp/style-orig.md >> "$src" ;;
              fence) sed '0,/^---$/s//--- /' /tmp/style-orig.md > "$src" ;;
              crlf)  sed 's/$/\r/' /tmp/style-orig.md > "$src" ;;
            esac
            got=$(node plugins/agent-handbook/hooks/emit-standing-rules.js)
            printf '%s' "$got" | grep -q "keep-coding-instructions" \
              && { echo "front matter leaked after a $mangle edit"; exit 1; }
            [ -n "$got" ] || { echo "emitter went silent after a $mangle edit"; exit 1; }
          done
          echo "emitter holds against bom, leading blank, fence whitespace and crlf"

      - name: agent-statusline renders every fixture as specified, and refuses off the happy path
        run: |
          set -euo pipefail
          # The plugin's acceptance criterion (#269), pinned here so a regression in either the
          # renderer or a fixture cannot ship. REFUSAL FIRST: unparseable or empty stdin must
          # print nothing on stdout, name the failure on stderr, and exit 1 — the failure paths
          # are shown working before the happy paths are believed.
          set +e
          printf 'not json' | node plugins/agent-statusline/statusline.js >/tmp/sl-refuse.out 2>/tmp/sl-refuse.err
          rc=$?
          set -e
          [ "$rc" = "1" ] || { echo "unparseable stdin did not exit 1 (got $rc)"; exit 1; }
          [ ! -s /tmp/sl-refuse.out ] || { echo "the refusal path printed something on stdout"; cat /tmp/sl-refuse.out; exit 1; }
          grep -q "agent-statusline" /tmp/sl-refuse.err \
            || { echo "the refusal stderr did not name the parse failure"; cat /tmp/sl-refuse.err; exit 1; }
          set +e
          : | node plugins/agent-statusline/statusline.js >/tmp/sl-empty.out 2>/tmp/sl-empty.err
          rc=$?
          set -e
          [ "$rc" = "1" ] || { echo "empty stdin did not exit 1 (got $rc)"; exit 1; }
          [ ! -s /tmp/sl-empty.out ] || { echo "the empty-stdin path printed something on stdout"; cat /tmp/sl-empty.out; exit 1; }
          grep -q "agent-statusline" /tmp/sl-empty.err \
            || { echo "the empty-stdin stderr did not name the failure"; cat /tmp/sl-empty.err; exit 1; }
          # The Pro-shaped fixture must render exactly the line the ticket asserts, with colour
          # escapes stripped. Comparisons are anchored end-to-end so a stray space or missing
          # segment fails the step.
          pro_actual=$(node plugins/agent-statusline/statusline.js < plugins/agent-statusline/fixtures/payload-pro.json \
            | perl -pe 's/\e\[[0-9;]*m//g')
          pro_expected="◐ ctx 84k/200k (42%) wk 63%/5h 15% Opus 5"
          [ "$pro_actual" = "$pro_expected" ] \
            || { echo "Pro fixture rendered wrong line"; echo "  got:      [$pro_actual]"; echo "  expected: [$pro_expected]"; exit 1; }
          # The API-key-shaped fixture must render with the whole budget segment absent — not
          # empty, not surrounded by spaces — so an API-key user sees two of the three figures.
          api_actual=$(node plugins/agent-statusline/statusline.js < plugins/agent-statusline/fixtures/payload-apikey.json \
            | perl -pe 's/\e\[[0-9;]*m//g')
          api_expected="◐ ctx 84k/200k (42%) Opus 5"
          [ "$api_actual" = "$api_expected" ] \
            || { echo "API-key fixture rendered wrong line"; echo "  got:      [$api_actual]"; echo "  expected: [$api_expected]"; exit 1; }
          # The never-blank fallback: a payload whose context_window fields are zero must still
          # produce SOMETHING on stdout — a bare stderr refusal here would leave the status line
          # empty in the harness, the documented failure mode the fallback exists to prevent.
          blank_actual=$(node plugins/agent-statusline/statusline.js < plugins/agent-statusline/fixtures/payload-blank.json \
            | perl -pe 's/\e\[[0-9;]*m//g')
          [ -n "$blank_actual" ] \
            || { echo "the missing-context_window fixture produced an empty line"; exit 1; }
          # And, as a private-reference guard from the same ticket, none of the reference
          # script's internal markers may have travelled into the public tree.
          if grep -rn -E "1918|ORCH|apetukhov" plugins/agent-statusline/; then
            echo "private references from the reference script leaked into the plugin"; exit 1
          fi

      - name: selftest.sh argument branches (no server needed)
        run: |
          bash plugins/voice-loop/scripts/selftest.sh --help | grep -q "Usage:" \
            || { echo "--help did not print the usage text"; exit 1; }
          if bash plugins/voice-loop/scripts/selftest.sh --no-such-flag 2>/tmp/selftest-err.txt; then
            echo "an unknown argument was accepted instead of rejected"; exit 1
          fi
          grep -q "unknown argument: --no-such-flag" /tmp/selftest-err.txt \
            || { echo "unknown-arg rejection lost its diagnostic"; cat /tmp/selftest-err.txt; exit 1; }

      - name: tls-probe.sh argument branches (no network needed)
        run: |
          bash plugins/voice-loop/scripts/tls-probe.sh --help > /tmp/tls-help.txt
          grep -q "Usage:" /tmp/tls-help.txt || { echo "--help did not print the usage text"; exit 1; }
          set +e
          bash plugins/voice-loop/scripts/tls-probe.sh --no-such-flag 2>/tmp/tls-err.txt
          rc=$?
          set -e
          # 64, not 1: a mis-invocation must never come back as the certificate diagnosis, because
          # /voice-setup is told to act on exit 1 by running what the message names
          [ "$rc" = "64" ] || { echo "an unknown argument exited $rc, not 64"; cat /tmp/tls-err.txt; exit 1; }
          grep -q "unknown argument: --no-such-flag" /tmp/tls-err.txt \
            || { echo "unknown-arg rejection lost its diagnostic"; cat /tmp/tls-err.txt; exit 1; }
          set +e
          bash plugins/voice-loop/scripts/tls-probe.sh --url 2>/tmp/tls-dangling.txt
          rc=$?
          set -e
          [ "$rc" = "64" ] || { echo "a flag with no value exited $rc, not 64"; exit 1; }
          grep -q -- "--url wants a value after it" /tmp/tls-dangling.txt \
            || { echo "a missing value was reported as something else"; cat /tmp/tls-dangling.txt; exit 1; }
          # a plain-http URL has no certificate to verify: refused, never reported as fine
          set +e
          bash plugins/voice-loop/scripts/tls-probe.sh --url http://127.0.0.1:8355 2>/tmp/tls-http.txt
          rc=$?
          set -e
          [ "$rc" = "64" ] || { echo "an http:// URL was probed instead of refused (exit $rc)"; exit 1; }
          grep -q "no certificate to verify" /tmp/tls-http.txt \
            || { echo "the http:// refusal lost its diagnostic"; cat /tmp/tls-http.txt; exit 1; }

      - name: tls-probe.sh fails closed when its preconditions are missing
        run: |
          # The launcher's own two guards. Both are one line of bash that nothing else exercises,
          # and both are what a user with a broken install actually meets first.
          set +e
          # bash by absolute path: with PATH emptied, `env` could not look the interpreter up either
          env PATH=/nonexistent "$(command -v bash)" plugins/voice-loop/scripts/tls-probe.sh 2>/tmp/tls-nopy.txt
          rc=$?
          set -e
          [ "$rc" = "1" ] || { echo "a missing python3 did not fail closed (exit $rc)"; exit 1; }
          grep -q "python3 is required" /tmp/tls-nopy.txt \
            || { echo "the missing-python3 guard lost its diagnostic"; cat /tmp/tls-nopy.txt; exit 1; }
          orphan="$RUNNER_TEMP/orphan-launcher"
          mkdir -p "$orphan"
          cp plugins/voice-loop/scripts/tls-probe.sh "$orphan/"   # deliberately WITHOUT the .py
          set +e
          bash "$orphan/tls-probe.sh" 2>/tmp/tls-nopy2.txt
          rc=$?
          set -e
          [ "$rc" = "1" ] || { echo "a launcher with no tls-probe.py beside it did not fail closed"; exit 1; }
          grep -q "tls-probe.py is missing" /tmp/tls-nopy2.txt \
            || { echo "the missing-script guard lost its diagnostic"; cat /tmp/tls-nopy2.txt; exit 1; }

      - name: contour-poll.sh argument branches (no server needed)
        run: |
          bash plugins/voice-loop/scripts/contour-poll.sh --help | grep -q "contour-poll" \
            || { echo "--help did not print the usage text"; exit 1; }
          set +e
          bash plugins/voice-loop/scripts/contour-poll.sh --no-such-flag 2>/tmp/contour-err.txt
          rc=$?
          set -e
          # 64, not 1: a mis-invocation must never read as "an alert is active" — exit 1 is the
          # page signal a scheduler or a hook branches on
          [ "$rc" = "64" ] || { echo "an unknown argument exited $rc, not 64"; cat /tmp/contour-err.txt; exit 1; }
          grep -q "unknown argument" /tmp/contour-err.txt \
            || { echo "unknown-arg rejection lost its diagnostic"; cat /tmp/contour-err.txt; exit 1; }
          # a config that names services none of which is usable is a config error (64), never
          # "contour ok" — a monitoring hole must not report as coverage
          export VOICE_LOOP_CONFIG="$RUNNER_TEMP/contour-bad.json"
          printf '%s' '{"contour": {"services": ["not-a-url"]}}' > "$VOICE_LOOP_CONFIG"
          set +e
          bash plugins/voice-loop/scripts/contour-poll.sh --status "$RUNNER_TEMP/contour.json" 2>/tmp/contour-cfg.txt
          rc=$?
          set -e
          [ "$rc" = "64" ] || { echo "a config with no usable service exited $rc, not 64"; exit 1; }
          grep -q "has no fetchable" /tmp/contour-cfg.txt \
            || { echo "the config error lost its diagnostic"; cat /tmp/contour-cfg.txt; exit 1; }

      - name: contour-poll.sh fails closed when its preconditions are missing
        run: |
          # The launcher's own two guards — byte-identical in shape to tls-probe.sh's, which have
          # had their own step since #52 while these had none: drop either one and every gate here
          # stayed green. Both exit 64, not 1: a broken install is "called wrong", never "an alert
          # is active", and that distinction is the whole exit-code vocabulary of #40.
          set +e
          # bash by absolute path: with PATH emptied, `env` could not look the interpreter up either
          env PATH=/nonexistent "$(command -v bash)" plugins/voice-loop/scripts/contour-poll.sh 2>/tmp/contour-nopy.txt
          rc=$?
          set -e
          [ "$rc" = "64" ] || { echo "a missing python3 did not fail closed (exit $rc)"; cat /tmp/contour-nopy.txt; exit 1; }
          grep -q "python3 is required" /tmp/contour-nopy.txt \
            || { echo "the missing-python3 guard lost its diagnostic"; cat /tmp/contour-nopy.txt; exit 1; }
          orphan="$RUNNER_TEMP/orphan-contour"
          mkdir -p "$orphan"
          cp plugins/voice-loop/scripts/contour-poll.sh "$orphan/"   # deliberately WITHOUT the .py
          set +e
          bash "$orphan/contour-poll.sh" 2>/tmp/contour-nopy2.txt
          rc=$?
          set -e
          [ "$rc" = "64" ] || { echo "a launcher with no contour_poll.py beside it did not fail closed (exit $rc)"; exit 1; }
          grep -q "contour_poll.py is missing" /tmp/contour-nopy2.txt \
            || { echo "the missing-script guard lost its diagnostic"; cat /tmp/contour-nopy2.txt; exit 1; }

      - name: coverage badge projection boundaries (fix #3697)
        run: |
          set -euo pipefail
          # The colour projection was the one step in the coverage pipeline with nothing checking
          # it — the gate is tested, the combined artifact is tested, the colour was not, and
          # that is how an unreachable green threshold shipped to a public README unnoticed.
          # The rule now lives in `.github/scripts/coverage_badge.py`; this step exercises it at
          # the four boundaries the badge lives by, so a regression here turns `gate` red on the
          # pull request itself rather than on the first main push after the fact. See fix(#3697).
          #
          # Two layers of check, both pointing at the same module so a future drift cannot make
          # the CLI re-pass while the library fails (or vice versa):
          #   1. the CLI's own `check` subcommand — exercises the same four cases from inside
          #      the module and exits 1 on any mismatch. Cheap, runs on every PR.
          #   2. a direct import of `color_for` and an explicit per-case assertion — pins each
          #      case by name, so a future failure names which boundary moved rather than just
          #      the exit code.
          set +e
          python3 .github/scripts/coverage_badge.py check
          rc=$?
          set -e
          [ "$rc" = "0" ] || { echo "coverage_badge boundary check failed (exit $rc) — see fix(#3697) for the four cases"; exit 1; }
          python3 -c "
          import sys
          sys.path.insert(0, '.github/scripts')
          import coverage_badge
          cases = [
              (98, 99, 'red',         'below the floor is red'),
              (99, 99, 'yellow',      'at the floor is yellow'),
              (100, 99, 'brightgreen', 'a perfect score is green (cap takes over at floor 99)'),
              (100, 100, 'brightgreen', 'a perfect score at the cap is green (cap wins over equal-to-the-floor)'),
          ]
          broken = [(name, got, want) for v, f, want, name in cases for got in [coverage_badge.color_for(v, f)] if got != want]
          if broken:
              for name, got, want in broken:
                  print(f'  {name}: got {got!r}, expected {want!r}', file=sys.stderr)
              print(f'{len(broken)} coverage_badge boundary case(s) failed', file=sys.stderr)
              sys.exit(1)
          print(f'{len(cases)} coverage_badge boundary cases passed')
          "

  # `claude plugin validate --strict` is the local structural check the plugin directory's review
  # pipeline runs on every submission: it verifies plugin.json, skill/agent/command frontmatter
  # and hooks/hooks.json against the schema, with no auth and no model calls. The directory
  # submission readiness depended on the same validator running here on every PR — a silent
  # validate failure was invisible (windowsill submission readiness, fix(#5816)). The claude CLI
  # is a public npm package, so this is obtainable in CI without any credential the repo does not
  # hold. The listing-test step beside it covers the directory rules the strict validator does
  # not check on its own (no `category` on the manifest, the marketplace-side `icon` path,
  # the 256 KiB per-file inspection limit, the 512-file cap). Both are wired into `gate.needs` so
  # the merge queue cannot open a submission that the directory would hold or warn.
  validate:
    name: validate plugin manifests (claude plugin validate --strict + directory listing)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: install the claude CLI (public npm package, no credential needed)
        run: npm install -g @anthropic-ai/claude-code
      - name: validate all four plugins (strict)
        env:
          # a local check (no auth, no model calls): suppress the CLI's update/telemetry network
          # traffic so the gate is deterministic rather than dependent on external endpoints
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
        run: |
          claude plugin validate --strict ./plugins/voice-loop
          claude plugin validate --strict ./plugins/sill-core
          claude plugin validate --strict ./plugins/agent-handbook
          claude plugin validate --strict ./plugins/agent-statusline
      # The directory rules the strict validator does not check on its own: no `category` on the
      # manifest, the marketplace-side `icon` path, the 256 KiB per-file inspection limit,
      # and the 512-file cap. This is the test that fix(#5816) introduced — see
      # `tests/test_directory_listing.py`.
      - name: install pytest (the runner image has python3 but not pytest)
        run: python3 -m pip install pytest
      - name: directory listing acceptance (no category, marketplace icon, 256 KiB, 512 files)
        run: |
          python3 -m pytest tests/test_directory_listing.py
      # The directory's ALLOWED_TOOLS_BROAD and RUNTIME_FETCH_EXEC holds (windowsill#5867) are not
      # something `claude plugin validate --strict` can see — every flagged skill file passed that
      # validator at f9a0faa, and the directory rescan after #5816 still held voice-loop and
      # agent-statusline on the two findings. The new test is the instrument: the allowed-tools
      # check pins the cure on all eight flagged files (no Bash entry in any form), and the
      # pipe-to-shell check covers the two piped lines the directory named in RUNTIME_FETCH_EXEC.
      # Each check is a separate test function with its own refusal fixture asserted first, so a
      # future regression that turns a refusal into a pass fails the named test rather than
      # silently flipping green. The follow-up credential ticket adds its environment-read check
      # as its own test file, so the two PRs do not share one.
      - name: directory policy (no Bash in allowed-tools, no pipe-to-shell)
        run: |
          python3 -m pytest tests/test_directory_policy.py
      # fix(#5816) — credential-closure policy: voice-loop takes provider keys only from
      # userConfig; the policy test refuses-first on the pre-change tree (f9a0faa) and
      # passes on the post-change tree, with the OBSOLETE_KEYS / providers.py exemptions
      # asserted by their own cases.
      - name: credential policy (voice-loop reads keys from userConfig only)
        run: |
          python3 -m pytest tests/test_credential_policy.py
      # `claude plugin validate` checks each manifest's own structure; it does NOT compare the two
      # copies of voice-loop's dependencies — the one in plugin.json and its mirror in the
      # marketplace entry. A change that touches one and forgets the other passes both validations,
      # and which copy then wins depends on how the user installed. Compare them here,
      # order-insensitively, so drift is the gate's red, not a first-use crash.
      #
      # python3 rather than jq: this same runner image runs a bare `python3 -c` in the shellcheck
      # job with no setup-python step, so python3 is already present; and the three-way absence
      # logic (both-absent = agreement, one-absent = failure, present = sorted compare) reads more
      # plainly in Python than in jq.
      - name: dependencies agree across the two manifests
        run: |
          python3 - <<'PY'
          import json, sys
          plugin_path = "plugins/voice-loop/.claude-plugin/plugin.json"
          market_path = ".claude-plugin/marketplace.json"
          with open(plugin_path) as fh:
              plugin_deps = json.load(fh).get("dependencies")
          with open(market_path) as fh:
              market = json.load(fh)
          entry = next((p for p in market.get("plugins", []) if p.get("name") == "voice-loop"), None)
          market_deps = entry.get("dependencies") if entry else None
          # None stays None (field absent); a present list is sorted for an order-insensitive compare.
          norm = lambda d: None if d is None else sorted(d)
          if norm(plugin_deps) == norm(market_deps):
              print(f"OK: voice-loop dependencies agree in both manifests: {sorted(plugin_deps or [])}")
              sys.exit(0)
          print("FAIL: voice-loop's dependencies field disagrees between the two manifests:")
          print(f"  {plugin_path}: {plugin_deps!r}")
          print(f"  {market_path}: {market_deps!r}")
          print("Both must declare the same dependencies (compared order-insensitively).")
          sys.exit(1)
          PY

  coverage:
    name: unit tests (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # model-free and fast (well under a second of test time), so the version grid is cheap here.
        # The heavy loopback jobs stay single-version per OS.
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: install test dependencies (no models, no network at test time)
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r tests/voice-loop/tests/requirements.txt
      # Each plugin owns its test run: pytest.ini and .coveragerc live in the plugin's test
      # root (the directory's own test config lives at tests/voice-loop/ for the BINARIES_NOT_INSPECTED
      # reason documented in CLAUDE.md) and its paths (testpaths, pythonpath, coverage source) are
      # relative to it, so the suite is invoked from there rather than from the repo root.
      #
      # Coverage measures the server, the helper scripts (dictate.py, speak.py, report_bug.py,
      # tls-probe.py), and the diagnose tool (scripts/doctor.py). The 100% claim for
      # ``server/voice_server*`` stays on every leg (the non-negotiable one, every platform
      # reaches it); the 100% claims for ``scripts/*``, ``scripts/doctor.py`` and
      # ``scripts/speak.py`` were moved off this leg and onto the union — see the
      # ``pytest with coverage gates`` step in `combined-coverage` below, which runs them against
      # the data combined from Linux, Windows and macOS legs. A single-platform gate here
      # could only ever be red, since these scripts now contain platform-specific code that
      # must be measured by the platform that can reach it.
      - name: pytest with coverage gates (server 100%)
        working-directory: tests/voice-loop
        run: |
          pytest --cov --cov-report=term-missing
          echo "::group::server coverage gate (non-negotiable 100%, asserted on every leg)"
          python -m coverage report --include='**/plugins/voice-loop/server/voice_server*' --fail-under=100
          echo "::endgroup::"
          echo "::endgroup::"

      # The plugin's own .coverage is what gets uploaded — the same file pytest just wrote, with
      # nothing in between touching it.  Previously this job also ran `coverage combine --append`
      # to maintain a shelf-level .coverage at the repo root, on the assumption that "a future
      # report can sum across plugins" — but the combined-coverage job below is that future: it
      # downloads each plugin's per-runner artifact and combines them itself with the path remap,
      # so the shelf-level file has had no consumer for several rounds and its `coverage combine`
      # was deleting the very file this step uploads.  Removed.
      - name: upload coverage for combined report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-voice-loop-${{ matrix.python }}
          path: tests/voice-loop/.coverage
          # .coverage starts with a dot — v4 excludes hidden files by default, which is why
          # `if-no-files-found: error` was firing even on a green matrix leg.
          include-hidden-files: true
          if-no-files-found: error

  voice-loop-windows:
    name: voice-loop unit tests (windows, python 3.12)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install test dependencies
        working-directory: tests/voice-loop
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tests/requirements.txt
      # Coverage collection only — no `--fail-under` here, because each Windows leg is by
      # construction missing the macOS/Linux arms and a per-leg gate here could only ever be red.
      # The 100% claim for `scripts/*` is asserted once, against the union of the three platforms,
      # in combined-coverage.
      - name: run the voice-loop unit suite on native Windows (with coverage)
        working-directory: tests/voice-loop
        run: python -m pytest --cov --cov-report=term-missing
      # `.coverage` starts with a dot — v4 excludes hidden files by default, which is why
      # `include-hidden-files: true` is the same dance as on the Linux legs.
      - name: upload coverage for combined report (windows)
        uses: actions/upload-artifact@v4
        with:
          name: coverage-voice-loop-windows-3.12
          path: tests/voice-loop/.coverage
          include-hidden-files: true
          if-no-files-found: error

  voice-loop-macos:
    name: voice-loop unit tests (macos, python 3.12)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install test dependencies
        working-directory: tests/voice-loop
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tests/requirements.txt
      # Coverage collection only — no `--fail-under` here, because each macOS leg is by
      # construction missing the Linux/Windows arms and a per-leg gate here could only ever
      # be red. The 100% claim for `scripts/*` is asserted once, against the union of the
      # three platforms, in combined-coverage.
      - name: run the voice-loop unit suite on macOS (with coverage)
        working-directory: tests/voice-loop
        run: python -m pytest --cov --cov-report=term-missing
      - name: upload coverage for combined report (macos)
        uses: actions/upload-artifact@v4
        with:
          name: coverage-voice-loop-macos-3.12
          path: tests/voice-loop/.coverage
          include-hidden-files: true
          if-no-files-found: error

  sill-core-coverage:
    name: sill-core unit tests (${{ matrix.os }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: install test dependencies
        run: python -m pip install pytest pytest-cov pytest-timeout
      - name: pytest with a hard 100% coverage gate
        working-directory: plugins/sill-core
        run: pytest --cov=sill_core --cov-report=term-missing --cov-fail-under=100

      - name: upload coverage for combined report (ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-sill-core-${{ matrix.python }}
          path: plugins/sill-core/.coverage
          # .coverage starts with a dot — v4 excludes hidden files by default, which is why
          # `if-no-files-found: error` was firing on every ubuntu leg.
          include-hidden-files: true
          if-no-files-found: error

  loopback:
    name: loopback selftest (${{ matrix.os }}, ${{ matrix.language }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Two lanes, two languages: Russian exercises the accentuation pipeline on Linux, English
          # exercises the macOS adapter path — English is a first-class language, not a fallback.
          - os: ubuntu-latest
            accent: "1"
            language: ru
            hook_phrase: Проверка озвучки завершена. Потоковый синтез работает. Контур замкнут и отвечает.
          - os: macos-latest
            accent: "0"
            language: en
            hook_phrase: Speech check complete. The streaming path is live. The loop hears itself and answers.
    env:
      VOICE_LOOP_STT_MODEL: small
      VOICE_LOOP_LANGUAGE: ${{ matrix.language }}
      VOICE_LOOP_DEVICE: cpu
      VOICE_LOOP_ACCENT: ${{ matrix.accent }}
      HF_HOME: ${{ github.workspace }}/.cache/hf
      TORCH_HOME: ${{ github.workspace }}/.cache/torch
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: system audio libraries
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq libsndfile1 jq
          else
            brew install libsndfile jq
          fi

      - name: cache speech models
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache
          key: models-${{ matrix.os }}-${{ matrix.language }}-${{ env.VOICE_LOOP_STT_MODEL }}-v1

      - name: install server dependencies
        run: |
          python -m pip install --upgrade pip
          if [ "$RUNNER_OS" = "Linux" ]; then
            pip install --index-url https://download.pytorch.org/whl/cpu torch
          fi
          pip install -r plugins/voice-loop/server/requirements.txt

      # The prefetch wraps each download in a bounded _with_retry helper. The retryable pattern
      # matches the TEXT of the raised exception rather than its class because neither
      # faster_whisper nor torch.hub surfaces an HTTP status uniformly: faster_whisper swallows
      # HfHubHTTPError / ConnectionError and re-tries the same fetch with local_files_only=True,
      # so a cold-cache HF 403/503 reaches the caller as LocalEntryNotFoundError ("Cannot find an
      # appropriate cached snapshot folder ... outgoing traffic has been disabled") — a message
      # carrying no status code and none of 403|429|503|rate limit|Service Unavailable|Temporary
      # failure. The torch.hub half also gets skip_validation=True and the built-in job token
      # (no new secret) to drop the anonymous api.github.com ref-lookup rate limit.
      - name: prefetch models for this lane's language (cached across runs)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os, re, sys, time, torch
          sys.path.insert(0, "plugins/voice-loop/server")
          from voice_server import SILERO_VOICES
          from faster_whisper import WhisperModel

          _RETRYABLE = re.compile(
              r"403|429|503|rate limit|Service Unavailable|Temporary failure"
              r"|LocalEntryNotFoundError|outgoing traffic has been disabled"
          )
          _BACKOFFS = (5, 15, 45, 120)   # sleeps BETWEEN attempts 1->2, 2->3, 3->4, 4->5

          def _with_retry(fn):
              """Run fn() with up to 5 attempts. Retry only on errors whose repr() matches the
              retryable pattern; re-raise anything else immediately. The final attempt's error
              propagates so a genuinely broken host still fails the job loudly."""
              for attempt in range(1, 6):
                  try:
                      return fn()
                  except Exception as err:
                      if not _RETRYABLE.search(repr(err)):
                          raise
                      if attempt < 5:
                          sleep_for = _BACKOFFS[attempt - 1]
                          print(f"prefetch attempt {attempt}/5 failed: {err}")
                          time.sleep(sleep_for)
                      else:
                          print(f"prefetch attempt {attempt}/5 failed: {err}")
                          raise

          language = os.environ["VOICE_LOOP_LANGUAGE"]
          silero_language, model_id, speaker = SILERO_VOICES[language]
          print(f"prefetching whisper + silero {model_id} ({silero_language}, {speaker}) for {language}")
          _with_retry(lambda: WhisperModel(
              os.environ["VOICE_LOOP_STT_MODEL"], device="cpu", compute_type="int8",
          ))
          _with_retry(lambda: torch.hub.load(
              "snakers4/silero-models", "silero_tts",
              language=silero_language, speaker=model_id, trust_repo=True,
              skip_validation=True,
          ))
          PY

      - name: start the server
        run: |
          # Redirect server stdout/stderr to a log file so a 500 in /stt or /tts leaves a traceback
          # in the artifact rather than the bit bucket — without it, the next STT failure is
          # undiagnosable from the job log.
          python plugins/voice-loop/server/voice_server.py >/tmp/voice-loop.log 2>&1 &
          echo $! > /tmp/voice-loop.pid
          # `if` keeps a failing poll from tripping the step's `set -e` while the server warms up
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8355/health; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8355/health

      - name: loopback selftest (TTS -> STT -> compare)
        run: |
          bash plugins/voice-loop/scripts/selftest.sh \
            --endpoint http://127.0.0.1:8355 \
            --language "$VOICE_LOOP_LANGUAGE" \
            --strict --threshold 0.7
      # Placed AFTER the loopback selftest (and before the contour-poll steps) so `if: failure()`
      # can actually trigger when a later step fails: the "start the server" step that precedes
      # this one only fails on a missing health endpoint, and a 500 from /stt or /tts does not
      # surface there. The traceback we want lives in /tmp/voice-loop.log and only materialises
      # when the loopback run actually exercises those endpoints.
      - name: dump server log on failure (only when something else failed)
        if: failure()
        run: |
          echo "::group::server log"
          cat /tmp/voice-loop.log || true
          echo "::endgroup::"

      - name: contour-poll contract (real invocation — quiet, then a REAL demotion page)
        run: |
          # The monitoring substrate of #40, proven end to end against the live server this job
          # already runs: the poller writes contour.json, and the speaking hook — registration
          # unchanged — voices an active alert ONCE. The demotion is real: the runners have no
          # GPU, so the server's /health genuinely reports "cpu" while the config declares a
          # client that depends on "cuda". Own state dir, like the contract steps beside it, so
          # every file counted here is one of ours.
          #
          # Two things this step asserts that a log line alone cannot. FIRST, the status file is
          # written where contour.status_path says and NOT to the default — and the hook still
          # finds it. Passing a --status that happens to equal the default hid a seam where the
          # poller could poll correctly, exit 1 correctly, and page nobody. SECOND, delivery is
          # OBSERVABLE: speak.player is a recording script, so "the alert was voiced" is bytes
          # that reached a player process, asserted through play_text's own outcome line
          # (`played rc=…`), not through a line logged three statements before playback starts.
          export XDG_STATE_HOME="$RUNNER_TEMP/contour-state"
          state_dir="$XDG_STATE_HOME/voice-loop"
          mkdir -p "$state_dir"
          # deliberately NOT the default path, and never named on the command line
          export CONTOUR_STATUS="$RUNNER_TEMP/contour-elsewhere/contour.json"
          mkdir -p "$(dirname "$CONTOUR_STATUS")"
          export PLAYED_LOG="$RUNNER_TEMP/contour-played.txt"
          : > "$PLAYED_LOG"
          cat > "$RUNNER_TEMP/recording-player.sh" <<'SH'
          #!/usr/bin/env bash
          # stands in for aplay/afplay: records that real audio reached a real player process
          wc -c < "$1" >> "$PLAYED_LOG"
          SH
          export VOICE_LOOP_CONFIG="$RUNNER_TEMP/contour-config.json"
          cat > "$VOICE_LOOP_CONFIG" <<JSON
          {
            "tts": { "backend": "lan", "endpoint": "http://127.0.0.1:8355" },
            "speak": { "player": "bash $RUNNER_TEMP/recording-player.sh", "timeout": 180 },
            "contour": {
              "services": [ { "name": "voice-loop", "health": "http://127.0.0.1:8355/health" } ],
              "vram": { "command": false },
              "status_path": "$CONTOUR_STATUS"
            }
          }
          JSON
          # quiet first: the server is up, and nothing is expected of its device. No --status: the
          # SCHEDULED shape, resolving the path out of the config exactly as the hook will.
          bash plugins/voice-loop/scripts/contour-poll.sh \
            || { echo "a healthy contour paged"; cat "$CONTOUR_STATUS"; exit 1; }
          [ -f "$CONTOUR_STATUS" ] \
            || { echo "contour.status_path was ignored — nothing at $CONTOUR_STATUS"; exit 1; }
          [ -f "$state_dir/contour.json" ] \
            && { echo "the poller wrote the DEFAULT path, so this step proves nothing"; exit 1; }
          python3 - <<'PY'
          import json, os
          status = json.load(open(os.environ["CONTOUR_STATUS"]))
          service = status["services"]["voice-loop"]
          assert service["reachable"] is True and service["ok"] is True, status
          assert status["alerts"] == [], status["alerts"]
          # the file is the page, not a dashboard: no accumulated window, and small enough that the
          # hook re-reading it on every tool call costs nothing
          assert set(status) == {"at", "max_age", "alerts", "services", "vram"}, sorted(status)
          assert os.path.getsize(os.environ["CONTOUR_STATUS"]) < 2048, "the status file is growing again"
          PY

          # THE QUIET DIRECTION, which nothing covered: a green contour, a hook that really runs
          # its whole speaking path, and NOT ONE word about the contour. Asserted positively (the
          # turn's own line was delivered) so that "said nothing" cannot be a crash in disguise.
          python3 -c 'import json; print(json.dumps({"type": "assistant", "message": {"content": [{"type": "text", "text": "🔊 the gate is speaking"}]}}))' > /tmp/contour-marked.jsonl
          printf '%s' '{"transcript_path": "/tmp/contour-marked.jsonl"}' | bash plugins/voice-loop/scripts/speak.sh
          grep -q "played rc=" "$state_dir/speak.log" \
            || { echo "the hook never reached playback, so its silence proves nothing"; cat "$state_dir/speak.log"; exit 1; }
          [ -s "$PLAYED_LOG" ] \
            || { echo "no audio reached the player — delivery is not observable here"; exit 1; }
          grep -q "contour:" "$state_dir/speak.log" \
            && { echo "a clean contour was not silent"; cat "$state_dir/speak.log"; exit 1; }

          # now declare the dependency — a client relies on cuda and the runner has none: the page
          python3 -c 'import json, os; p = os.environ["VOICE_LOOP_CONFIG"]; c = json.load(open(p)); c["contour"]["services"][0]["expect_device"] = "cuda"; json.dump(c, open(p, "w"))'
          set +e
          bash plugins/voice-loop/scripts/contour-poll.sh > /tmp/contour-out.txt
          rc=$?
          set -e
          [ "$rc" = "1" ] || { echo "a real demotion did not page (exit $rc)"; cat /tmp/contour-out.txt; exit 1; }
          grep -q "ALERT voice-loop is serving on cpu, expected cuda" /tmp/contour-out.txt \
            || { echo "the demotion alert lost its message"; cat /tmp/contour-out.txt; exit 1; }

          # …and the hook turns the active alert into a VOICE — exactly once, however often it
          # fires. The transcript has nothing marked in it, so every delivery counted from here on
          # is the ALERT's own.
          python3 -c 'import json; print(json.dumps({"type": "assistant", "message": {"content": [{"type": "text", "text": "nothing marked here"}]}}))' > /tmp/contour-transcript.jsonl
          before_played=$(grep -c "played rc=" "$state_dir/speak.log")
          before_wavs=$(wc -l < "$PLAYED_LOG")
          printf '%s' '{"transcript_path": "/tmp/contour-transcript.jsonl"}' | bash plugins/voice-loop/scripts/speak.sh
          grep -q "contour: voicing 1 alert(s)" "$state_dir/speak.log" \
            || { echo "the hook did not voice the active alert"; cat "$state_dir/speak.log"; exit 1; }
          # play_text's OWN outcome, not the decision three statements above it: regress playback to
          # return early and "voicing 1 alert(s)" still appears, while these two do not.
          [ "$(grep -c "played rc=" "$state_dir/speak.log")" -gt "$before_played" ] \
            || { echo "the page was announced but play_text never played it"; cat "$state_dir/speak.log"; exit 1; }
          grep -q "nothing played via=" "$state_dir/speak.log" \
            && { echo "the page reached no player"; cat "$state_dir/speak.log"; exit 1; }
          [ "$(wc -l < "$PLAYED_LOG")" -gt "$before_wavs" ] \
            || { echo "no audio bytes reached the player for the alert"; exit 1; }

          # the second firing, and it must leave a POSITIVE mark. "no second `contour: voicing`" is
          # equally satisfied by a run that died before it ever looked — speak.sh swallows every
          # exception and exits 0, so dying is exactly what a regression here looks like.
          printf '%s' '{"transcript_path": "/tmp/contour-transcript.jsonl"}' | bash plugins/voice-loop/scripts/speak.sh
          grep -q "contour: already announced — nothing to voice (1 alert(s) still active)" "$state_dir/speak.log" \
            || { echo "the second firing never reached the dedup"; cat "$state_dir/speak.log"; exit 1; }
          [ "$(grep -c "contour: voicing" "$state_dir/speak.log")" = "1" ] \
            || { echo "a persistent alert paged twice"; cat "$state_dir/speak.log"; exit 1; }

      - name: contour-poll VRAM probe (a REAL subprocess spawn, with a stub card)
        run: |
          # contour.vram.command is the one place this poller starts a process, and the gate
          # configured it to `false` everywhere — so the spawn, the argv split, the parse and the
          # floor comparison shipped with nothing in CI ever running them. nvidia-smi is stubbed
          # (no runner has a card); the SPAWN is real, and so is the page it produces.
          export XDG_STATE_HOME="$RUNNER_TEMP/contour-vram-state"
          mkdir -p "$XDG_STATE_HOME/voice-loop"
          cat > "$RUNNER_TEMP/fake-nvidia-smi.sh" <<'SH'
          #!/usr/bin/env bash
          # two cards, and the tightest one is what the floor is compared against
          printf '2206\n11\n'
          SH
          export VOICE_LOOP_CONFIG="$RUNNER_TEMP/contour-vram-config.json"
          cat > "$VOICE_LOOP_CONFIG" <<JSON
          {
            "contour": {
              "services": [ { "name": "voice-loop", "health": "http://127.0.0.1:8355/health" } ],
              "vram": { "command": "bash $RUNNER_TEMP/fake-nvidia-smi.sh", "min_free_mib": 200 }
            }
          }
          JSON
          set +e
          bash plugins/voice-loop/scripts/contour-poll.sh > /tmp/contour-vram.txt
          rc=$?
          set -e
          [ "$rc" = "1" ] || { echo "free VRAM under the floor did not page (exit $rc)"; cat /tmp/contour-vram.txt; exit 1; }
          grep -q "ALERT free VRAM is 11 MiB, below the 200 MiB floor" /tmp/contour-vram.txt \
            || { echo "the vram alert lost its message (or read the wrong card)"; cat /tmp/contour-vram.txt; exit 1; }

      - name: TLS-probe contract (real invocation — green)
        run: |
          # fix(#5816) removed the SSL_CERT_FILE / SSL_CERT_DIR read from tls-probe.py, so the
          # env-override fix kind is gone too. The probe cannot deliver an "override in force"
          # diagnosis because there is no override left to read. The python.org branch's own
          # step below is the one carrying the acceptance criterion (#52).
          set +e
          bash plugins/voice-loop/scripts/tls-probe.sh --timeout 20
          rc=$?
          set -e
          case "$rc" in
            0) ;;
            2) echo "::warning::the probe could not reach its host (exit 2) — TLS unproven, not red" ;;
            *) echo "the probe called a healthy interpreter red (exit $rc)"; exit 1 ;;
          esac

      - name: TLS-probe contract (real invocation — the python.org trap names its own installer)
        run: |
          set -euo pipefail
          # THE acceptance criterion of #52, pinned by a real invocation: on python.org-installer
          # Python with an unpopulated store, the message names
          # "/Applications/Python X.Y/Install Certificates.command" VERBATIM and offers to run it.
          # No runner has such a Python, so the two things remedy() keys that diagnosis off are
          # stood up FOR REAL rather than mocked — an interpreter that really lives under the
          # framework layout, and a real file at the installer's own path — while the failure
          # itself is a real handshake against a real self-signed listener. Nothing here sets
          # SSL_CERT_*: an override would short-circuit to the branch the step above covers.
          probe="$PWD/plugins/voice-loop/scripts/tls-probe.py"
          work="$RUNNER_TEMP/tls-trap"
          rm -rf "$work"; mkdir -p "$work"

          # 1. the version: read the ACTUAL framework version from the runner's own sys.base_prefix.
          #    On a python.org-installer Python this is e.g. "3.12"; on Homebrew/pyenv/distro it is
          #    None, and the python.org branch will never be reached — the probe falls through to
          #    a generic fix. That is correct behaviour, and the assertions below accept it.
          version=$(python3 -c "
          import re, sys
          m = re.search(r'/Library/Frameworks/Python\.framework/Versions/(\d+\.\d+)', sys.base_prefix)
          print(m.group(1) if m else '')
          ")
          echo "detected framework version: ${version:-none}"

          # 2. the installer, at the one absolute path the message has to name. When the runner IS
          #    a python.org-installer Python, this path is exactly what the probe will name.
          if [ -n "$version" ]; then
            apps="/Applications/Python $version"
            installer="$apps/Install Certificates.command"
            sudo mkdir -p "$apps"
            printf '#!/bin/sh\necho "the installer stub ran" >&2\nexit 9\n' | sudo tee "$installer" >/dev/null
            sudo chmod 0755 "$installer"
            trap 'kill "$listener" 2>/dev/null || true; sudo rm -rf "'"$apps"'"' EXIT
          else
            installer="(none — not a python.org Python)"
            trap 'kill "$listener" 2>/dev/null || true' EXIT
          fi

          # 3. a certificate that genuinely does not verify, served by this machine — no
          #    third-party bad-certificate host to depend on, and no network egress needed.
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=127.0.0.1" \
            -keyout "$work/key.pem" -out "$work/cert.pem" 2>/dev/null
          cat > "$work/listener.py" <<'PY'
          import http.server, ssl, sys
          ctx = ssl.SSLContext(ssl.PROTOCOL_TLS_SERVER)
          ctx.load_cert_chain(sys.argv[1], sys.argv[2])
          srv = http.server.HTTPServer(("127.0.0.1", 8399), http.server.BaseHTTPRequestHandler)
          srv.socket = ctx.wrap_socket(srv.socket, server_side=True)
          srv.serve_forever()
          PY
          python3 "$work/listener.py" "$work/cert.pem" "$work/key.pem" >/dev/null 2>&1 &
          listener=$!
          trap 'kill "$listener" 2>/dev/null || true; sudo rm -rf "/Applications/Python 9.9"' EXIT
          python3 -c "
          import socket, sys, time
          for _ in range(80):
              try:
                  socket.create_connection(('127.0.0.1', 8399), 0.5).close(); sys.exit(0)
              except OSError: time.sleep(0.25)
          sys.exit('the self-signed listener never came up')
          "

          run_probe() {   # the probe, from THIS interpreter, with the environment demonstrably clean
            env -u SSL_CERT_FILE -u SSL_CERT_DIR python3 "$probe" \
              --url https://127.0.0.1:8399/ --timeout 20 "$@"
          }

          set +e
          run_probe >"$work/red.txt" 2>&1
          rc=$?
          set -e
          cat "$work/red.txt"
          [ "$rc" = "1" ] || { echo "a certificate that does not verify did not exit 1 (got $rc)"; exit 1; }
          grep -q "certificate verification failed" "$work/red.txt" \
            || { echo "the failure was not classified as a certificate problem"; exit 1; }
          grep -qF "Fix, exactly:" "$work/red.txt" \
            || { echo "the failure message no longer names a fix -- that IS the feature"; exit 1; }
          if [ -n "$version" ]; then
            grep -qF "$installer" "$work/red.txt" \
              || { echo "the message did not name $installer -- that IS ticket #52"; exit 1; }
            grep -qF -- "--fix" "$work/red.txt" \
              || { echo "a runnable remedy was not offered as runnable"; exit 1; }
            if grep -q "the installer stub ran" "$work/red.txt"; then
              echo "the installer was executed without --fix"; exit 1
            fi
          fi
          if grep -q "unset SSL_CERT" "$work/red.txt"; then
            echo "the env-override branch answered a machine that has no override"; exit 1
          fi

          # the same answer, machine-readable, so the BRANCH is pinned and not merely its prose
          set +e
          run_probe --json >"$work/red.json" 2>/dev/null
          rc=$?
          set -e
          [ "$rc" = "1" ] || { echo "--json disagreed with the prose run (exit $rc)"; exit 1; }
          FRAMEWORK_VERSION="$version" python3 - "$work/red.json" <<'PY'
          import json, os, sys
          report = json.load(open(sys.argv[1]))
          assert report["result"] == "certificate", report
          fix = report["fix"]
          version = os.environ.get("FRAMEWORK_VERSION", "")
          if version:
              assert fix["kind"] == "install-certificates-command", fix
              assert fix["runnable"] is True, fix
              assert fix["command"].endswith("/Install Certificates.command"), fix
              print(f"the python.org branch answered: {fix['command']}")
          else:
              print(f"not a python.org Python — fix kind is {fix['kind']} (expected, not asserting)")
          PY

          # and --fix really SPAWNS that path: one argv with a space in it, a real subprocess, whose
          # non-zero exit comes back as "which half failed" rather than a claimed green.
          if [ -n "$version" ]; then
            set +e
            run_probe --fix >"$work/fix.txt" 2>&1
            rc=$?
            set -e
            cat "$work/fix.txt"
            [ "$rc" = "1" ] || { echo "a repair that did not take was not still red (exit $rc)"; exit 1; }
            grep -q "the installer stub ran" "$work/fix.txt" \
              || { echo "--fix did not actually spawn the installer"; exit 1; }
            grep -q "exit 9" "$work/fix.txt" \
              || { echo "the failed repair did not say which half of it failed"; exit 1; }
          else
            echo "not a python.org Python — --fix spawn test skipped"
          fi

      - name: Stop-hook contract (real invocation, no speakers)
        env:
          PHRASE: ${{ matrix.hook_phrase }}
          LANGUAGE: ${{ matrix.language }}
        run: |
          mkdir -p "$HOME/.config/voice-loop"
          cat > "$HOME/.config/voice-loop/config.json" <<JSON
          {
            "language": "$LANGUAGE",
            "tts": { "backend": "lan", "endpoint": "http://127.0.0.1:8355" },
            "speak": { "marker": "🔊", "player": "true", "timeout": 180, "max_chars": 4000 }
          }
          JSON
          # The server merges sentence chunks up to MAX_TTS_CHARS (800) per SSE chunk, so a
          # multi-chunk stream needs >800 chars of marked text: the phrase is repeated past that
          # (and speak.max_chars raised above its 600 default) so chunks>1 below proves real
          # multi-event SSE streaming, not a single-chunk degenerate stream.
          LONG_PHRASE=$(python3 -c 'import os
          p = os.environ["PHRASE"]
          s = p
          while len(s) <= 820:
              s = s + " " + p
          print(s)')
          export LONG_PHRASE
          python3 -c 'import json, os; print(json.dumps({"type": "assistant", "message": {"content": [{"type": "text", "text": "a plain line that must NOT be spoken\n\U0001F50A " + os.environ["LONG_PHRASE"]}]}}))' > /tmp/transcript.jsonl
          printf '%s' '{"transcript_path": "/tmp/transcript.jsonl"}' | bash plugins/voice-loop/scripts/speak.sh
          state="${XDG_STATE_HOME:-$HOME/.local/state}/voice-loop"
          echo "--- speak.log"; cat "$state/speak.log"
          grep -qF "$PHRASE" "$state/last-spoken" || { echo "marker extraction failed"; exit 1; }
          if grep -q "plain line" "$state/last-spoken"; then echo "an unmarked line was spoken"; exit 1; fi
          grep -q "played rc=0" "$state/speak.log" || { echo "synthesis/playback path failed"; exit 1; }
          # the heartbeat: a real hook invocation must leave its last-fired stamp behind
          test -s "$state/hook-last-fired" || { echo "the hook left no heartbeat stamp"; exit 1; }
          played_line=$(grep "played rc=" "$state/speak.log" | tail -n 1)
          printf '%s\n' "$played_line" | grep -q "via=stream" \
            || { echo "playback did not go via SSE streaming (via=stream missing) -- the stream silently regressed to the blob /tts fallback"; exit 1; }
          chunks=$(printf '%s\n' "$played_line" | sed -n 's/.*chunks=\([0-9][0-9]*\).*/\1/p')
          [ "${chunks:-0}" -gt 1 ] \
            || { echo "expected a multi-chunk stream (chunks>1), got chunks=${chunks:-none} -- the marked text no longer spans multiple server chunks"; exit 1; }

      - name: queued-not-dropped contract (real invocation — a line behind a playing clip)
        env:
          PHRASE: ${{ matrix.hook_phrase }}
          LANGUAGE: ${{ matrix.language }}
        run: |
          # The flush-race backoff is 2.65 s all told and a real clip runs far longer than that, so
          # a Stop firing that arrived while the previous line was still playing used to run out of
          # ladder and return 0 IN SILENCE — the line was never spoken and the log never said so.
          # Two REAL hook processes prove the fix, because the thing being waited on is one process
          # reading another's playing.pid: fakes cannot show that the file is written early enough
          # or read back as live. Own config and own state dir, like the eager step beside it, so
          # every line counted here is one of ours.
          export VOICE_LOOP_CONFIG="$RUNNER_TEMP/queue-config.json"
          export XDG_STATE_HOME="$RUNNER_TEMP/queue-state"
          export TRANSCRIPT="$RUNNER_TEMP/queue-transcript.jsonl"
          state="$XDG_STATE_HOME/voice-loop"
          log="$state/speak.log"

          # A player that holds the stage far longer than the backoff ladder — the ~10 s clip from
          # the report, rounded up so a slow runner cannot end it before the second hook looks.
          cat > "$RUNNER_TEMP/long-clip" <<'SH'
          #!/usr/bin/env bash
          sleep 15
          SH
          chmod +x "$RUNNER_TEMP/long-clip"

          cat > "$VOICE_LOOP_CONFIG" <<JSON
          {
            "language": "$LANGUAGE",
            "tts": { "backend": "lan", "endpoint": "http://127.0.0.1:8355" },
            "speak": { "marker": "🔊", "player": "$RUNNER_TEMP/long-clip", "timeout": 180 }
          }
          JSON

          A=$(python3 -c 'import os; print(os.environ["PHRASE"].split(".")[0].strip() + ".")')
          B=$(python3 -c 'import os; print(os.environ["PHRASE"].split(".")[1].strip() + ".")')
          append() { python3 "$RUNNER_TEMP/append.py" "$1"; }
          fire() { printf '%s' "{\"transcript_path\": \"$TRANSCRIPT\"}" | bash plugins/voice-loop/scripts/speak.sh; }
          cat > "$RUNNER_TEMP/append.py" <<'PY'
          # one assistant message appended to the transcript, in the shape speak.py reads
          import json, os, sys

          rec = {"type": "assistant", "message": {"content": [{"type": "text", "text": sys.argv[1]}]}}
          with open(os.environ["TRANSCRIPT"], "a", encoding="utf-8") as fh:
              fh.write(json.dumps(rec) + "\n")
          PY

          # (1) The line in front: a Stop firing that starts playing and stays playing.
          append "🔊 $A"
          fire & first=$!
          for _ in $(seq 1 60); do
            if [ -s "$state/playing.pid" ]; then break; fi
            sleep 1
          done
          [ -s "$state/playing.pid" ] || { echo "the first firing never recorded a speaking chain"; exit 1; }

          # (2) The next turn fires WHILE that clip is in the air, and its own line only reaches the
          # transcript five seconds later — past the 2.65 s ladder, which is the whole point.
          ( sleep 5; append "🔊 $B" ) & late=$!
          fire
          wait "$late" || true
          kill "$first" 2>/dev/null || true
          wait "$first" || true

          echo "--- speak.log"; cat "$log"
          grep -q "queued, not dropped" "$log" \
            || { echo "the second firing did not wait out the clip in front -- the line was dropped at 2.65s again"; exit 1; }
          if grep -q "gave up with nothing new" "$log"; then
            echo "the second firing gave up while the previous line was still playing"; exit 1
          fi
          grep -qF "text: $B" "$log" \
            || { echo "the queued line was never spoken"; exit 1; }
          grep -qF "$B" "$state/last-spoken" \
            || { echo "the queued line never reached last-spoken"; exit 1; }
          grep -q "played rc=0" "$log" \
            || { echo "nothing was played at all in this step"; exit 1; }

      - name: eager-speaking contract (real invocation — ledger, seeding, lock)
        env:
          PHRASE: ${{ matrix.hook_phrase }}
          LANGUAGE: ${{ matrix.language }}
        run: |
          # The eager subsystem's real-process proof, against the SAME live server the Stop-hook
          # step above used: the PostToolUse firing, first-run seeding, the spoken-ledger that makes
          # the two event paths idempotent with each other, and the non-blocking inter-firing lock.
          # It is set BESIDE that step rather than layered onto it — a SECOND config file turns
          # speak.eager on without touching the default-off one whose behaviour the step above
          # pinned, and a SECOND state dir keeps this step's speak.log countable: every
          # "played rc=0" line in it is one of ours, so "spoken exactly once" is a number, not a
          # grep that could be satisfied by an earlier step's line.
          export VOICE_LOOP_CONFIG="$RUNNER_TEMP/eager-config.json"
          export XDG_STATE_HOME="$RUNNER_TEMP/eager-state"
          export TRANSCRIPT="$RUNNER_TEMP/eager-transcript.jsonl"
          state="$XDG_STATE_HOME/voice-loop"
          log="$state/speak.log"
          ledger="$state/spoken.ledger"

          # A player that takes real time to "play", as a real one does. The speaking lock is held
          # for the whole read-claim-speak-PLAY sequence, so an instant no-op player would leave the
          # concurrency check below racing an already-finished process instead of a speaking one.
          cat > "$RUNNER_TEMP/slow-player" <<'SH'
          #!/usr/bin/env bash
          sleep 0.5
          SH
          chmod +x "$RUNNER_TEMP/slow-player"

          cat > "$VOICE_LOOP_CONFIG" <<JSON
          {
            "language": "$LANGUAGE",
            "tts": { "backend": "lan", "endpoint": "http://127.0.0.1:8355" },
            "speak": {
              "marker": "🔊", "player": "$RUNNER_TEMP/slow-player", "timeout": 180, "eager": true
            }
          }
          JSON

          cat > "$RUNNER_TEMP/append.py" <<'PY'
          # one assistant message appended to the transcript, in the shape speak.py reads
          import json, os, sys

          rec = {"type": "assistant", "message": {"content": [{"type": "text", "text": sys.argv[1]}]}}
          with open(os.environ["TRANSCRIPT"], "a", encoding="utf-8") as fh:
              fh.write(json.dumps(rec) + "\n")
          PY
          cat > "$RUNNER_TEMP/payload.py" <<'PY'
          # the hook payload the harness puts on stdin — hook_event_name is what picks the path
          import json, os, sys

          print(json.dumps({"transcript_path": os.environ["TRANSCRIPT"], "hook_event_name": sys.argv[1]}))
          PY

          # Three short sentences off this lane's OWN phrase: real speech in the lane's language,
          # one quick synthesis each, and each short enough to appear whole in the log's `text:`
          # line (which is clipped at 80 characters).
          A=$(python3 -c 'import os; print(os.environ["PHRASE"].split(".")[0].strip() + ".")')
          B=$(python3 -c 'import os; print(os.environ["PHRASE"].split(".")[1].strip() + ".")')
          C=$(python3 -c 'import os; print(os.environ["PHRASE"].split(".")[2].strip() + ".")')
          # `grep -c` exits 1 on zero matches, which would trip the step's `set -e` before the
          # assertion could report it — the count itself is the answer we want, so keep it.
          played() { grep -c "played rc=0" "$log" 2>/dev/null || true; }
          said() { grep -c -F "text: $1" "$log" 2>/dev/null || true; }
          claims() { grep -c -v '^seeded:' "$ledger" 2>/dev/null || true; }
          fire() { python3 "$RUNNER_TEMP/payload.py" "$1" | bash plugins/voice-loop/scripts/speak.sh; }

          # (1) FIRST RUN — a transcript nobody has spoken for is HISTORY, not news: its marked line
          # goes into the ledger WITHOUT being spoken. Turning eager on mid-session must not recite
          # the session back, which is exactly what the live deployment did.
          python3 "$RUNNER_TEMP/append.py" "🔊 $C"
          fire PostToolUse
          echo "--- speak.log after the seeding firing"; cat "$log"
          grep -q "seeded 1 line(s) of history" "$log" \
            || { echo "the first eager firing did not write this transcript off as history"; exit 1; }
          [ "$(played)" -eq 0 ] || { echo "the seeding firing recited history back at us"; exit 1; }
          [ -s "$ledger" ] || { echo "no spoken.ledger was written"; exit 1; }
          [ "$(claims)" -eq 1 ] \
            || { echo "the seeded line was not claimed: $(claims) key(s)"; cat "$ledger"; exit 1; }

          # (2) EAGER SPEAKS MID-TURN — a marked line appears, a tool call fires PostToolUse, and it
          # is spoken there and then. This is the whole reason the event path exists.
          python3 "$RUNNER_TEMP/append.py" "🔊 $A"
          fire PostToolUse
          echo "--- speak.log after the eager firing"; cat "$log"
          [ "$(played)" -eq 1 ] \
            || { echo "PostToolUse did not speak the fresh line (played rc=0 count: $(played))"; exit 1; }
          [ "$(said "$A")" -eq 1 ] || { echo "the eager firing spoke something other than the fresh line"; exit 1; }
          [ "$(said "$C")" -eq 0 ] || { echo "the seeded history line was spoken after all"; exit 1; }
          [ "$(claims)" -eq 2 ] \
            || { echo "the spoken line was not claimed in the ledger"; cat "$ledger"; exit 1; }

          # (3) THE LEDGER ACROSS EVENTS — Stop's scope IS that same last message, so without the
          # ledger it would say again what eager just said. It must stay quiet; and it must still
          # speak a line that lands after the final tool call, which no eager firing ever saw.
          fire Stop
          [ "$(played)" -eq 1 ] || { echo "Stop re-spoke the line eager had already spoken"; exit 1; }
          [ "$(said "$A")" -eq 1 ] || { echo "Stop re-extracted the already-claimed line"; exit 1; }
          python3 "$RUNNER_TEMP/append.py" "🔊 $B"
          fire Stop
          echo "--- speak.log after both Stop firings"; cat "$log"
          [ "$(played)" -eq 2 ] || { echo "Stop did not speak the closing line eager never saw"; exit 1; }
          [ "$(said "$B")" -eq 1 ] || { echo "the closing line was not the one spoken"; exit 1; }

          # (4) THE LOCK, FOR REAL — two firings launched back to back over one fresh line. The
          # acquire is NON-BLOCKING, so the loser must bow out at once leaving its line unclaimed:
          # exactly ONE of the two speaks, and nobody queues up behind the speaker. (Which of the
          # two wins is the scheduler's business; the assertion is symmetric in them.)
          python3 "$RUNNER_TEMP/append.py" "🔊 $PHRASE"
          fire PostToolUse & first=$!
          fire PostToolUse & second=$!
          wait "$first"
          wait "$second"
          echo "--- speak.log after the concurrent pair"; cat "$log"
          [ "$(played)" -eq 3 ] \
            || { echo "expected exactly one more played line from the pair (3 in all), got $(played)"; exit 1; }
          [ "$(grep -c 'line left unclaimed' "$log" 2>/dev/null || true)" -eq 1 ] \
            || { echo "the losing firing did not bow out non-blockingly and leave its line unclaimed"; exit 1; }
          echo "--- spoken.ledger"; cat "$ledger"

      - name: dictation contract (real invocation, no microphone)
        env:
          PHRASE: ${{ matrix.hook_phrase }}
          LANGUAGE: ${{ matrix.language }}
        run: |
          # Exercises dictate.py's real record -> STT -> clipboard path headlessly, against the
          # same live server. The microphone is faked through dictate's own config seams:
          # dictate.recorder pins the recorder table's "pw-record" entry, whose executable is a
          # PATH-shadowing script that "records" by copying a server-TTS-rendered clip of the
          # phrase (real speech, so STT has something to hear) and then waits for dictate's
          # stop signal; dictate.clipboard pins "wl-copy", shadowed by a script capturing stdin.
          fake="$RUNNER_TEMP/dictate-fake"
          mkdir -p "$fake"
          export FAKE_RECORD_WAV="$RUNNER_TEMP/dictate-source.wav"
          export FAKE_CLIP_FILE="$RUNNER_TEMP/dictate-clip.txt"
          body=$(python3 -c 'import json, os; print(json.dumps({"text": os.environ["PHRASE"], "language": os.environ["LANGUAGE"]}))')
          curl -fsS --noproxy '*' -m 180 -o "$FAKE_RECORD_WAV" -X POST http://127.0.0.1:8355/tts \
            -H 'Content-Type: application/json' --data "$body"
          [ "$(head -c 4 "$FAKE_RECORD_WAV")" = "RIFF" ] \
            || { echo "TTS did not return a WAV for the fake microphone"; exit 1; }
          cat > "$fake/pw-record" <<'SH'
          #!/usr/bin/env bash
          # fake microphone: "record" by copying pre-synthesized speech, then wait to be stopped.
          # The wait keeps THIS interpreter as the pidfile process instead of exec'ing away into
          # `sleep`: the stop toggle's PID-reuse guard (windowsill#203) reads /proc/<pid>/cmdline and
          # refuses to signal a process that no longer looks like the recorder — and a recording that
          # can never be stopped is a leak. The trap reaps the sleep child and turns the stop signal
          # into a clean exit, so the pid dies on INT the same way it did under `exec sleep`.
          wav=""
          for arg in "$@"; do wav="$arg"; done
          cp "${FAKE_RECORD_WAV:?}" "${wav:?}"
          sleep 60 &
          waiter=$!
          trap 'kill "$waiter" 2>/dev/null; exit 0' INT TERM
          wait "$waiter"
          SH
          cat > "$fake/wl-copy" <<'SH'
          #!/usr/bin/env bash
          # fake clipboard: capture stdin (dictate fills both the clipboard and primary selections)
          cat >> "${FAKE_CLIP_FILE:?}"
          SH
          chmod +x "$fake/pw-record" "$fake/wl-copy"
          export VOICE_LOOP_CONFIG="$RUNNER_TEMP/dictate-config.json"
          cat > "$VOICE_LOOP_CONFIG" <<JSON
          {
            "language": "$LANGUAGE",
            "stt": { "backend": "lan", "endpoint": "http://127.0.0.1:8355" },
            "dictate": { "recorder": "pw-record", "clipboard": "wl-copy", "debounce_ms": 2000 }
          }
          JSON
          export PATH="$fake:$PATH"
          state="${XDG_STATE_HOME:-$HOME/.local/state}/voice-loop"
          # debounce_ms is widened from its 750 ms default so BOTH sides of the guard are
          # deterministic here rather than racing an interpreter start: every fire in the train
          # below is unambiguously inside the window (0.3 s apart plus a python start, against 2 s),
          # and the real second toggle (3 s later) is unambiguously outside it.
          #
          # Every dictate.py fire is a contract: a non-zero exit ends the step under `set -e` with
          # no message, so each is named here — this step is the one place a silent toggle failure
          # (windowsill#203's own failure mode) must not reproduce itself.
          python3 plugins/voice-loop/scripts/dictate.py paste \
            || { echo "dictate start toggle failed (exit $?)"; cat "$state/dictate.log" 2>/dev/null || true; exit 1; }   # toggle 1: start the fake recorder
          # A HELD key, for real: an autorepeat TRAIN whose span (>= 2.4 s of sleeps alone) is
          # LONGER than the window. This is the input shape that tells a debounce from a rate
          # limiter — measured from the last ADMITTED toggle, the fire past 2 s is re-admitted and
          # stops the recording (windowsill#49 re-timed, not fixed), and the final toggle then
          # starts a second one; measured from the last FIRE, the whole hold stays one toggle.
          for _ in 1 2 3 4 5 6 7 8; do
            sleep 0.3
            python3 plugins/voice-loop/scripts/dictate.py paste \
              || { echo "dictate key-repeat toggle failed (exit $?)"; cat "$state/dictate.log" 2>/dev/null || true; exit 1; }   # OS key repeat: must be IGNORED
          done
          sleep 3
          python3 plugins/voice-loop/scripts/dictate.py paste \
            || { echo "dictate stop toggle failed (exit $?)"; cat "$state/dictate.log" 2>/dev/null || true; exit 1; }   # toggle 2: stop -> STT -> clipboard
          echo "--- dictate.log"; cat "$state/dictate.log"
          echo "--- clipboard capture"; cat "$FAKE_CLIP_FILE" 2>/dev/null || true; echo
          grep -q "recording via pw-record" "$state/dictate.log" \
            || { echo "the fake recorder was never started"; exit 1; }
          # the key-repeat guard: every one of the eight held-key re-fires was dropped, and none of
          # them started a second recorder or stopped the first (windowsill#49) — one recording
          # cycle for a hold three times longer than the window
          [ "$(grep -c "toggle ignored — key repeat" "$state/dictate.log")" = "8" ] \
            || { echo "the key-repeat train was not debounced for its whole length"; exit 1; }
          [ "$(grep -c "recording via pw-record" "$state/dictate.log")" = "1" ] \
            || { echo "the key-repeat re-fire started a second recording"; exit 1; }
          if grep -q "clip too short" "$state/dictate.log"; then
            echo "the recorded clip was dropped by the min-clip guard"; exit 1
          fi
          if grep -q "empty transcription" "$state/dictate.log"; then
            echo "STT returned no text for the recorded speech"; exit 1
          fi
          grep -q "transcript: " "$state/dictate.log" \
            || { echo "no transcript was logged"; exit 1; }
          if grep -q -e "unexpected error" -e "Traceback" "$state/dictate.log"; then
            echo "dictate hit an error path"; exit 1
          fi
          [ -s "$FAKE_CLIP_FILE" ] \
            || { echo "the transcript never reached the clipboard"; exit 1; }

      - name: streaming dictation contract (real invocation, fake provider via the relay)
        env:
          LANGUAGE: ${{ matrix.language }}
        run: |
          # fix(#5816) — cloud dictation is batch-only through the voice-loop MCP relay. The hotkey
          # script holds no key. With stt.cloud.streaming true, the dictate log records the batch-only
          # line, the relay's BATCH provider call returns the transcript, and the dictation reaches
          # the clipboard with via=relay. The config asks Deepgram — the one registry entry with a
          # streaming variant — so the opt-in is answered by the batch-only line itself, not by
          # the note an entry without a streaming variant would get. The legacy
          # fake_dg.py (an RFC 6455 websocket fake) cannot answer the relay's batch HTTP request, so
          # it is replaced here by a stdlib http.server fake on 127.0.0.1.
          fake="$RUNNER_TEMP/relay-fake"
          mkdir -p "$fake"
          export FAKE_RECORD_WAV="$RUNNER_TEMP/dictate-source.wav"   # the clip the step above made
          export FAKE_CLIP_FILE="$RUNNER_TEMP/relay-clip.txt"
          export XDG_STATE_HOME="$RUNNER_TEMP/relay-state"           # own state dir: countable logs
          state="$XDG_STATE_HOME/voice-loop"
          cat > "$fake/pw-record" <<'SH'
          #!/usr/bin/env bash
          wav=""
          for arg in "$@"; do wav="$arg"; done
          cp "${FAKE_RECORD_WAV:?}" "${wav:?}"
          sleep 60 &
          waiter=$!
          trap 'kill "$waiter" 2>/dev/null; exit 0' INT TERM
          wait "$waiter"
          SH
          cat > "$fake/wl-copy" <<'SH'
          #!/usr/bin/env bash
          cat >> "${FAKE_CLIP_FILE:?}"
          SH
          chmod +x "$fake/pw-record" "$fake/wl-copy"

          cat > "$RUNNER_TEMP/fake_provider.py" <<'PY'
          """Fake STT provider — one HTTP POST, returns the configured transcript JSON.

          The body is Deepgram's batch shape (the transcript nested under the first
          alternative of the first channel): Deepgram is the one registry entry with a
          streaming variant, so it is the provider whose ``stt.cloud.streaming`` opt-in
          is answered with the batch-only line this step asserts on."""
          import json, socketserver, sys
          from http.server import BaseHTTPRequestHandler, HTTPServer

          TRANSCRIPT = "the relay batch returned this"

          class Handler(BaseHTTPRequestHandler):
              def do_POST(self):  # noqa: N802 — http.server signature
                  length = int(self.headers.get("Content-Length", "0"))
                  self.rfile.read(length)
                  body = json.dumps(
                      {"results": {"channels": [{"alternatives": [{"transcript": TRANSCRIPT}]}]}}
                  ).encode()
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

              def log_message(self, *_args):
                  pass

          class NoLookupServer(HTTPServer):
              """Binds without a name lookup: http.server's server_bind resolves the host
              with socket.getfqdn, a reverse-DNS query that can stall a runner longer
              than this step's port wait, so the fake names itself by its address."""

              def server_bind(self):
                  socketserver.TCPServer.server_bind(self)
                  self.server_name = "127.0.0.1"
                  self.server_port = self.server_address[1]

          server = NoLookupServer(("127.0.0.1", 0), Handler)
          open(sys.argv[1], "w").write(str(server.server_address[1]))
          server.serve_forever()
          PY
          python3 "$RUNNER_TEMP/fake_provider.py" "$RUNNER_TEMP/fake_provider.port" \
              > "$RUNNER_TEMP/fake_provider.log" 2>&1 &
          provider_pid=$!
          for _ in $(seq 1 50); do [ -s "$RUNNER_TEMP/fake_provider.port" ] && break; sleep 0.2; done
          port=$(cat "$RUNNER_TEMP/fake_provider.port")
          [ -n "$port" ] || { echo "the fake provider never bound a port"; exit 1; }

          # Start the relay (voice_mcp.py) with the userConfig keys in its own environment
          # only, on its own socket path. The relay binds to $XDG_RUNTIME_DIR/voice-loop/
          # stt.sock and answers the dictation client. ``_stdio_loop`` returns when stdin
          # hits EOF, so we feed it ``tail -f /dev/null`` — a held-open stream that keeps
          # the MCP stdio loop alive past every dictate toggle. The keys ride the relay's
          # own ``env`` prefix and are never exported into this step's shell, so every
          # process started later in the step — the dictation toggles included — runs
          # without them, and the relay holds the only copy.
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/relay-runtime"
          mkdir -p "$XDG_RUNTIME_DIR/voice-loop"
          chmod 700 "$XDG_RUNTIME_DIR/voice-loop"
          tail -f /dev/null | env \
            CLAUDE_PLUGIN_OPTION_STT_API_KEY="not-a-real-key-and-never-leaves-this-runner" \
            CLAUDE_PLUGIN_OPTION_TTS_API_KEY="" \
            python3 plugins/voice-loop/scripts/voice_mcp.py > "$RUNNER_TEMP/relay.log" 2>&1 &
          relay_pid=$!
          # Trap so a failing assertion leaves the relay and the provider dead, never running
          # into the next job. ``kill -PIDS`` covers the tail -f wrapper AND the python process.
          trap 'kill "$relay_pid" "$provider_pid" 2>/dev/null || true; pkill -P "$relay_pid" 2>/dev/null || true' EXIT

          # Wait until the relay has bound the socket — ``_relay_loop`` binds after
          # ``_ensure_dir_mode``, and the dictation client's safety check refuses to
          # dial a path that does not exist. Bounded like the fake provider's port wait.
          for _ in $(seq 1 50); do
            [ -S "$XDG_RUNTIME_DIR/voice-loop/stt.sock" ] && break
            sleep 0.2
          done
          [ -S "$XDG_RUNTIME_DIR/voice-loop/stt.sock" ] \
            || { echo "the relay never bound the socket"; cat "$RUNNER_TEMP/relay.log"; exit 1; }

          export VOICE_LOOP_CONFIG="$RUNNER_TEMP/relay-config.json"
          cat > "$VOICE_LOOP_CONFIG" <<JSON
          {
            "language": "$LANGUAGE",
            "stt": {
              "backend": "cloud",
              "model": "nova-3",
              "cloud": {
                "provider": "deepgram",
                "streaming": true,
                "endpoint": "http://127.0.0.1:$port"
              }
            },
            "dictate": { "recorder": "pw-record", "clipboard": "wl-copy", "debounce_ms": 0 }
          }
          JSON
          export PATH="$fake:$PATH"

          # The hotkey dictation processes below inherit THIS shell's environment. The
          # step never exported the keys — they ride only the relay's own ``env`` prefix
          # above — so this guard asserts the production condition the loopback is
          # exercising: the dictation env carries no STT key, and the relay holds the
          # only copy. The relay's typed ``no-key`` reply is never the live answer here
          # because the relay was started with the key, so it dials the provider and
          # returns the transcript; what is under test is that the dictation reached it
          # without ever holding a key of its own.
          if env | grep -q "CLAUDE_PLUGIN_OPTION_STT_API_KEY"; then
            echo "the dictation env still carries the STT key — production condition violated"
            env | grep CLAUDE_PLUGIN_OPTION || true
            exit 1
          fi

          python3 plugins/voice-loop/scripts/dictate.py paste \
            || { echo "dictate start toggle failed (exit $?)"; cat "$state/dictate.log" 2>/dev/null || true; exit 1; }
          sleep 2
          python3 plugins/voice-loop/scripts/dictate.py paste \
            || { echo "dictate stop toggle failed (exit $?)"; cat "$state/dictate.log" 2>/dev/null || true; exit 1; }

          echo "--- dictate.log"; cat "$state/dictate.log"
          echo "--- relay log"; cat "$RUNNER_TEMP/relay.log" 2>/dev/null || true
          echo "--- fake provider"; cat "$RUNNER_TEMP/fake_provider.log"
          echo "--- clipboard capture"; cat "$FAKE_CLIP_FILE" 2>/dev/null || true; echo

          # streaming=true -> the batch-only line lands in the log, and the relay batch path runs.
          grep -q "streaming needs a key the hotkey path no longer holds; using batch via the relay" "$state/dictate.log" \
            || { echo "the streaming-opt-in was not answered with the batch-only line"; exit 1; }
          grep -q "via=relay" "$state/dictate.log" \
            || { echo "the dictation did not go via the relay -- it degraded to the batch-local path"; exit 1; }
          if grep -q -e "unexpected error" -e "Traceback" "$state/dictate.log"; then
            echo "the relay path hit an error"; exit 1
          fi
          # The pasted words come from the fake provider's transcript, not from the local whisper server.
          grep -q "the relay batch returned this" "$FAKE_CLIP_FILE" \
            || { echo "the clipboard does not hold what the relay transcribed"; exit 1; }
          [ -s "$state/dictate-last.wav" ] \
            || { echo "the clip was not kept"; exit 1; }

          # THE DEGRADE: with the relay still running, point stt.cloud.endpoint at a discard port.
          # The recording must still become text — by the relay's typed-failure path, falling back to
          # the local whisper server this job already started.
          python3 -c "
          import json, os
          path = os.environ['VOICE_LOOP_CONFIG']
          config = json.load(open(path))
          config['stt']['cloud']['endpoint'] = 'http://127.0.0.1:9'   # discard: never listening
          json.dump(config, open(path, 'w'))
          "
          export XDG_STATE_HOME="$RUNNER_TEMP/relay-degrade-state"
          state="$XDG_STATE_HOME/voice-loop"
          export FAKE_CLIP_FILE="$RUNNER_TEMP/relay-degrade-clip.txt"
          python3 plugins/voice-loop/scripts/dictate.py paste \
            || { echo "dictate start toggle failed on the dead endpoint (exit $?)"; cat "$state/dictate.log" 2>/dev/null || true; exit 1; }
          sleep 2
          python3 plugins/voice-loop/scripts/dictate.py paste \
            || { echo "dictate stop toggle failed on the dead endpoint (exit $?)"; cat "$state/dictate.log" 2>/dev/null || true; exit 1; }
          echo "--- dictate.log (degrade)"; cat "$state/dictate.log"
          grep -q "reason=provider-unreachable" "$state/dictate.log" \
            || { echo "the dead endpoint did not produce a typed relay failure"; exit 1; }
          grep -q "via=batch" "$state/dictate.log" \
            || { echo "the relay's typed failure did not degrade to local whisper"; exit 1; }
          [ -s "$FAKE_CLIP_FILE" ] \
            || { echo "the recording was LOST to the failed relay — nothing reached the clipboard"; exit 1; }
          [ -s "$state/dictate-last.wav" ] \
            || { echo "the clip was not kept for salvage"; exit 1; }

      - name: streaming dictation contract (real invocation, fake provider via the relay stream leg)
        env:
          LANGUAGE: ${{ matrix.language }}
        run: |
          # fix(#5881) — streaming cloud dictation is the wire through the relay's stream leg.
          # A real websocket fake (`fake_dg.py`, an RFC 6455 server that speaks the Deepgram
          # live shape) accepts the relay's dial, the relay forwards the worker's binary frames
          # into the provider and the provider's text frames back, and the worker assembles
          # the finals into the clipboard. ``via=stream`` lands in dictate.log; the fake's
          # transcript is what reaches the clipboard.
          fake="$RUNNER_TEMP/stream-fake"
          mkdir -p "$fake"
          export FAKE_RECORD_WAV="$RUNNER_TEMP/dictate-source.wav"
          export FAKE_CLIP_FILE="$RUNNER_TEMP/stream-clip.txt"
          export XDG_STATE_HOME="$RUNNER_TEMP/stream-state"
          state="$XDG_STATE_HOME/voice-loop"
          cat > "$fake/pw-record" <<'SH'
          #!/usr/bin/env bash
          wav=""
          for arg in "$@"; do wav="$arg"; done
          cp "${FAKE_RECORD_WAV:?}" "${wav:?}"
          sleep 60 &
          waiter=$!
          trap 'kill "$waiter" 2>/dev/null; exit 0' INT TERM
          wait "$waiter"
          SH
          cat > "$fake/wl-copy" <<'SH'
          #!/usr/bin/env bash
          cat >> "${FAKE_CLIP_FILE:?}"
          SH
          chmod +x "$fake/pw-record" "$fake/wl-copy"

          cat > "$RUNNER_TEMP/fake_dg.py" <<'PY'
          """A minimal Deepgram live websocket server, stdlib only.

          The relay dials this with the URL the worker computed (entry.streaming.url); the
          fake answers the websocket handshake and emits one interim and one final, then a
          Metadata close. The worker forwards its PCM frames to the fake (the relay is a byte
          copier, so anything the worker sends arrives here) and the fake's frames are forwarded
          back the same way. ``TRANSCRIPT`` is what the clipboard receives."""
          import json
import secrets
import socket
import socketserver
import struct
import sys
from typing import Tuple

TRANSCRIPT = "the relay stream returned this"

GUID = b"258EAFA5-E914-47DA-95CA-C5AB0DC85B11"


def _accept_token(key: bytes) -> bytes:
    import base64
    import hashlib
    return base64.b64encode(hashlib.sha1(key + GUID).digest())


def _read_request(conn: socket.socket) -> bytes:
            buf = b""
            while b"\r\n\r\n" not in buf:
                chunk = conn.recv(65536)
                if not chunk:
                    break
                buf += chunk
            return buf


def _frame(opcode: int, payload: bytes) -> bytes:
            mask = secrets.token_bytes(4) if opcode != 0x8 else b""
            length = len(payload)
            if length < 126:
                header = bytes([0x80 | opcode]) + bytes([0x80 | length]) + mask
            elif length < (1 << 16):
                header = bytes([0x80 | opcode, 0x80 | 126]) + struct.pack("!H", length) + mask
            else:
                header = bytes([0x80 | opcode, 0x80 | 127]) + struct.pack("!Q", length) + mask
            if mask:
                payload = bytes(b ^ mask[i % 4] for i, b in enumerate(payload))
            return header + payload


class _Handler:
    def __init__(self, conn: socket.socket, addr: Tuple[str, int]) -> None:
        self.conn = conn
        self.addr = addr
        self.received_audio = bytearray()

    def serve(self) -> None:
        try:
            request = _read_request(self.conn)
            lines = request.split(b"\r\n")
            key_line = next(line for line in lines if line.lower().startswith(b"sec-websocket-key:"))
            key = key_line.split(b":", 1)[1].strip()
            handshake = (
                b"HTTP/1.1 101 Switching Protocols\r\n"
                b"Upgrade: websocket\r\nConnection: Upgrade\r\n"
                b"Sec-WebSocket-Accept: " + _accept_token(key) + b"\r\n\r\n"
            )
            self.conn.sendall(handshake)
            interim = json.dumps(
                {
                    "type": "Results",
                    "is_final": False,
                    "channel": {"alternatives": [{"transcript": TRANSCRIPT}]},
                }
            ).encode()
            final = json.dumps(
                {
                    "type": "Results",
                    "is_final": True,
                    "channel": {"alternatives": [{"transcript": TRANSCRIPT}]},
                }
            ).encode()
            metadata = json.dumps({"type": "Metadata"}).encode()
            self.conn.sendall(_frame(0x1, interim))
            self.conn.sendall(_frame(0x1, final))
            # Drain a couple of client frames so the relay's client->provider leg has
            # something to forward — proves the byte-copier is wired both ways.
            self.conn.settimeout(0.5)
            try:
                while True:
                    chunk = self.conn.recv(65536)
                    if not chunk:
                        break
                    self.received_audio.extend(chunk)
            except (socket.timeout, OSError):
                pass
            self.conn.sendall(_frame(0x1, metadata))
            self.conn.sendall(_frame(0x8, b""))
        finally:
            try:
                self.conn.close()
            except OSError:
                pass


class _NoLookupServer(socketserver.TCPServer):
    allow_reuse_address = True

    def server_bind(self):
        socketserver.TCPServer.server_bind(self)
        self.server_name = "127.0.0.1"
        self.server_port = self.server_address[1]


class _Threaded(socketserver.ThreadingMixIn, _NoLookupServer):
    daemon_threads = True


server = _Threaded(("127.0.0.1", 0), lambda *a, **kw: None)
open(sys.argv[1], "w").write(str(server.server_address[1]))
server.serve_forever()
          PY
          python3 "$RUNNER_TEMP/fake_dg.py" "$RUNNER_TEMP/fake_dg.port" \
              > "$RUNNER_TEMP/fake_dg.log" 2>&1 &
          dg_pid=$!
          for _ in $(seq 1 50); do [ -s "$RUNNER_TEMP/fake_dg.port" ] && break; sleep 0.2; done
          dg_port=$(cat "$RUNNER_TEMP/fake_dg.port")
          [ -n "$dg_port" ] || { echo "the fake dg never bound a port"; exit 1; }

          export XDG_RUNTIME_DIR="$RUNNER_TEMP/stream-runtime"
          mkdir -p "$XDG_RUNTIME_DIR/voice-loop"
          chmod 700 "$XDG_RUNTIME_DIR/voice-loop"
          tail -f /dev/null | env \
            CLAUDE_PLUGIN_OPTION_STT_API_KEY="not-a-real-key-and-never-leaves-this-runner" \
            CLAUDE_PLUGIN_OPTION_TTS_API_KEY="" \
            python3 plugins/voice-loop/scripts/voice_mcp.py > "$RUNNER_TEMP/stream-relay.log" 2>&1 &
          relay_pid=$!
          trap 'kill "$relay_pid" "$dg_pid" 2>/dev/null || true; pkill -P "$relay_pid" 2>/dev/null || true' EXIT

          for _ in $(seq 1 50); do
            [ -S "$XDG_RUNTIME_DIR/voice-loop/stt.sock" ] && break
            sleep 0.2
          done
          [ -S "$XDG_RUNTIME_DIR/voice-loop/stt.sock" ] \
            || { echo "the relay never bound the socket"; cat "$RUNNER_TEMP/stream-relay.log"; exit 1; }

          export VOICE_LOOP_CONFIG="$RUNNER_TEMP/stream-config.json"
          cat > "$VOICE_LOOP_CONFIG" <<JSON
          {
            "language": "$LANGUAGE",
            "stt": {
              "backend": "cloud",
              "model": "nova-3",
              "cloud": {
                "provider": "deepgram",
                "streaming": true,
                "endpoint": "http://127.0.0.1:$dg_port"
              }
            },
            "dictate": { "recorder": "pw-record", "clipboard": "wl-copy", "debounce_ms": 0 }
          }
          JSON
          export PATH="$fake:$PATH"

          python3 plugins/voice-loop/scripts/dictate.py paste \
            || { echo "dictate start toggle failed (exit $?)"; cat "$state/dictate.log" 2>/dev/null || true; exit 1; }
          sleep 2
          python3 plugins/voice-loop/scripts/dictate.py paste \
            || { echo "dictate stop toggle failed (exit $?)"; cat "$state/dictate.log" 2>/dev/null || true; exit 1; }

          echo "--- dictate.log"; cat "$state/dictate.log"
          echo "--- stream relay log"; cat "$RUNNER_TEMP/stream-relay.log" 2>/dev/null || true
          echo "--- fake dg"; cat "$RUNNER_TEMP/fake_dg.log" 2>/dev/null || true
          echo "--- clipboard capture"; cat "$FAKE_CLIP_FILE" 2>/dev/null || true; echo

          # The streaming path lands via=stream, with the relay's stream leg in front.
          grep -q "via=stream" "$state/dictate.log" \
            || { echo "the dictation did not go via the streaming path"; exit 1; }
          if grep -q -e "unexpected error" -e "Traceback" "$state/dictate.log"; then
            echo "the streaming path hit an error"; exit 1
          fi
          grep -q "$TRANSCRIPT" "$FAKE_CLIP_FILE" \
            || { echo "the clipboard does not hold what the relayed stream produced"; exit 1; }
          [ -s "$state/dictate-last.wav" ] \
            || { echo "the clip was not kept for salvage"; exit 1; }
      - name: server log on failure
        if: failure()
        run: kill "$(cat /tmp/voice-loop.pid)" 2>/dev/null || true

  combined-coverage:
    name: combined coverage gate
    runs-on: ubuntu-latest
    needs: [coverage, voice-loop-windows, voice-loop-macos, sill-core-coverage]
    env:
      # Ratchet: update only to the measured percentage printed by this job after coverage improves.
      #
      # It is deliberately NOT 100. The shelf wants an honest hundred rather than a hundred reached
      # by not counting, so a plugin that needs an exclusion extends the combined rcfile's
      # `exclude_lines` under review — it never lowers this number to meet a figure.
      #
      # 90 -> 99 (#277) over the figure that job printed: 6277 statements, 19 missed, all 19 in
      # `dictate.py`. The comment then said 100 was unreachable and pointed at
      # `plugins/voice-loop/TESTING.md`, "What the union does not reach", for the list.
      #
      # 99 -> 100 (saharkit/sahar#3756). That reason held for three hours. #299 closed all 19 by
      # splitting each kernel32 CALL from the DECISION about its return value, so the decisions
      # became reachable on every platform; its own body records the correction — "That description
      # of the code was right. The conclusion drawn from it was not." The combined gate has printed
      # `measured=100%` since, with 0 missed on all four legs (6303 statements, 1920 branches).
      #
      # So the floor now equals the measurement, and the slack is gone: at 99 the shelf could have
      # lost up to 62 covered statements without the gate saying a word, on a shelf whose every
      # per-package gate is already `--fail-under=100`. If a leg is ever short, the answer is to
      # cover it or to record the shortfall — never to lower this number to fit.
      SHELF_COVERAGE_FLOOR: "100"
    # The measuring job is read-only — the badge push is carved out into publish-coverage-badge,
    # which is the ONE job in this workflow that needs to spend the token. Exposing `measured`
    # here lets the publish job consume the gate's verdict without re-deriving it from the
    # artifact, so the badge can never disagree with the gate.
    outputs:
      measured: ${{ steps.compute-coverage.outputs.measured }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install coverage
        run: python -m pip install coverage
      - name: download voice-loop coverage
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-voice-loop-*
          path: coverage-data/voice-loop
      - name: download sill-core coverage
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-sill-core-*
          path: coverage-data/sill-core
      - name: combine all plugin data and enforce the shelf gate
        id: compute-coverage
        run: |
          set -euo pipefail
          # Explicit arrival check: every expected artifact must land in the downloaded
          # directory. A leg that silently fails to upload would otherwise lower the combined
          # percentage instead of failing the job — the failure mode this list exists to
          # prevent. Each expected name is one matrix leg's `name:` on its upload step; the
          # platform-specific legs were added in #276 so the voice-loop union spans all three
          # platforms that ship code.
          VOICE_EXPECTED=(
            coverage-voice-loop-3.10
            coverage-voice-loop-3.11
            coverage-voice-loop-3.12
            coverage-voice-loop-3.13
            coverage-voice-loop-windows-3.12
            coverage-voice-loop-macos-3.12
          )
          SILL_EXPECTED=(
            coverage-sill-core-3.10
            coverage-sill-core-3.11
            coverage-sill-core-3.12
            coverage-sill-core-3.13
          )
          # Both plugin directories, because the loop below checks BOTH lists: the
          # sill-core artifacts land under coverage-data/sill-core, so listing only
          # coverage-data/voice-loop made every SILL_EXPECTED name read as missing and
          # the gate failed on the first of them, coverage-sill-core-3.10, while the
          # artifact was demonstrably present on the run.
          found_dirs=$(
            { ls -1 coverage-data/voice-loop 2>/dev/null || true
              ls -1 coverage-data/sill-core  2>/dev/null || true
            }
          )
          for expected in "${VOICE_EXPECTED[@]}" "${SILL_EXPECTED[@]}"; do
            if ! grep -qx "$expected" <<<"$found_dirs"; then
              echo "FAIL: expected coverage artifact $expected did not arrive"
              echo "a leg failed to upload; the shelf percentage is NOT lowered silently"
              exit 1
            fi
          done
          VOICE=${#VOICE_EXPECTED[@]}
          SILL=${#SILL_EXPECTED[@]}
          echo "combining $VOICE voice-loop + $SILL sill-core coverage files"

          # Path remapping: each runner's .coverage records absolute paths under
          # $GITHUB_WORKSPACE.  This job checks out the same repo at the same
          # path, so map runner paths → checkout paths so every source file
          # appears once in the combined report.
          cat > .coveragerc-combined <<'RCFILE'
          [paths]
          source =
              /home/runner/work/windowsill/windowsill
              D:/a/windowsill/windowsill
              /Users/runner/work/windowsill/windowsill
              .
          [report]
          show_missing = True
          # Both plugins register `pragma: no cover` and nothing else. voice-loop's
          # platform-specific code is now measured on a leg per platform (Linux,
          # Windows, macOS) rather than excluded — the `pragma: windows-only` and
          # `pragma: macos-only` tokens were dropped from `plugins/voice-loop/.coveragerc`
          # so every region that ships enters the denominator and gets covered by a
          # runner that can actually reach it. sill-core's own two `pragma: no cover`
          # arms in `sill_core/assistant_state.py` (the `sys.platform == "win32"` /
          # `else` fork) are deliberately out of this change's scope and remain
          # excluded through this list — sill-core uploads from Ubuntu only, so the
          # single `pragma: no cover` token is the only way to keep those two arms
          # out of the denominator without buying sill-core its own Windows lane.
          exclude_lines =
              pragma: no cover
          RCFILE
          export COVERAGE_RCFILE="$PWD/.coveragerc-combined"

          python -m coverage combine --keep \
            coverage-data/voice-loop/*/.coverage \
            coverage-data/sill-core/*/.coverage

          # If the path remap above did NOT collapse the two runners' paths,
          # each source file appears twice.  The combined percentage drops but
          # can still clear the floor — the gate passes while measuring the wrong
          # thing.  Catch that here: fail loudly when any path is duplicated.
          python -m coverage json -o - | python3 -c "
          import json, sys
          from collections import Counter
          data = json.load(sys.stdin)
          paths = sorted(data.get('files', {}).keys())

          # Normalize to repo-relative by stripping known CI runner prefixes.
          # After a working remap every path is already relative and passes
          # through unchanged.  A failed remap leaves runner-absolute paths
          # that normalise to the same relative stem — the duplicate lands here.
          def norm(p):
              for prefix in (
                  '/home/runner/work/windowsill/windowsill/',
                  '/Users/runner/work/windowsill/windowsill/',
                  'D:/a/windowsill/windowsill/',
              ):
                  if p.startswith(prefix):
                      return p[len(prefix):]
              return p

          normed = [norm(p) for p in paths]
          dupes = {p: c for p, c in Counter(normed).items() if c > 1}
          if dupes:
              print('FAIL: path remap did not collapse runner paths — these files are duplicated:')
              for p, c in sorted(dupes.items()):
                  print(f'  {p} ({c}x)')
              sys.exit(1)
          print(f'OK: {len(normed)} unique source files, no duplicates')
          "

          # The voice-loop scripts 100% claims moved off the Linux leg and onto the union —
          # see delta (a2) in #276. Each gate below asserts a non-empty file set against the
          # combined data, and exits non-zero with `No data to report.` if the include pattern
          # matches nothing, so a vacuous gate cannot pass quietly. File sets are reported by
          # the gate so the PR body can paste them; an empty list means a mis-specified pattern
          # and fails loud, not green.
          #
          # THE THREE FLOORS BELOW ARE ALL AT 100, AND EACH ONE MOVED THERE OVER A FIGURE THIS JOB
          # HAD ALREADY PRINTED — the only way a floor here is ever allowed to move. #276 retired
          # the 19-marker exclusion table and measures the platform regions on a leg per platform
          # instead, so lines that used to be excluded now count. The first honest run read 99 for
          # the scripts scope, 95 for doctor.py and 99 for speak.py — 61 statements and 13 partial
          # branches across contracts.py, dictate.py, doctor.py and speak.py, all of them Windows-
          # or macOS-only regions whose legs upload coverage but whose tests did not reach them.
          #
          # #277 wrote those tests — the kernel32 handle probes and the winreg distro scan on the
          # Windows leg, the no-WinDLL guards on the legs that have none, the UTF-16 decoder
          # anywhere — and 61 missed statements became 19, all of them in dictate.py. That left the
          # `scripts/*` scope at 99 while doctor.py went 95 -> 100 and speak.py 99 -> 100.
          #
          # The last 19 were unreachable because a decision about a return value was written in the
          # same function as the call that produced it: no runner can fail to open pid 4, produce a
          # process image without `.exe`, exit between two of its own calls, or raise a console-wide
          # CTRL_C_EVENT through the process running the tests. Splitting the kernel32 calls
          # (`_Kernel32`, no branching) from the decisions about their return values (`_win_pid_alive`,
          # `_win_image_is_recorder`, `_console_ctrl_c`, each taking the boundary as an argument) made
          # every one of them ordinary code, testable on all three legs against a stand-in that holds
          # no Win32 knowledge. Nothing was excluded to get there. This job then printed dictate.py
          # 100% and the whole scripts scope 100%, so this floor goes 99 -> 100 over that figure.
          #
          # The old 100 was over a SMALLER DENOMINATOR — it was reached by excluding these very lines,
          # so this is the first measurement of the full scope, not a lowered bar over the same one.
          # The gates stay ARMED rather than deleted so a regression downward still goes red between
          # here and #290; deleting them would leave scripts/ ungated entirely, because this branch
          # also removes the per-leg gate that used to assert the same claim.
          #
          # THE PATTERNS MUST LEAD WITH `**/`, NOT `*`. `coverage combine`'s `[paths]` canonical
          # above is the runner root, so every path in the combined data stays ABSOLUTE
          # (`/home/runner/work/windowsill/windowsill/plugins/voice-loop/scripts/doctor.py`) — the
          # remap collapses the three runners onto one prefix, it does not make the paths
          # repo-relative. In coverage 7.x a single `*` does not cross a `/`, so a leading `*`
          # cannot reach past that prefix and every gate below reported `No data to report.`
          # Verified against coverage.files.GlobMatcher on the real artifact:
          #   '*plugins/voice-loop/scripts/*'   -> absolute False, relative True
          #   '**/plugins/voice-loop/scripts/*' -> absolute True,  relative True
          # The `**/` form is correct under BOTH shapes, so it survives a later relative remap.
          echo "::group::voice-loop scripts coverage gate (Linux+Windows+macOS union, floor at 100)"
          python -m coverage report --include='**/plugins/voice-loop/scripts/*' --fail-under=100
          echo "::endgroup::"
          echo "::group::voice-loop doctor.py coverage gate (#156 B1 — 100% on the union)"
          python -m coverage report --include='**/plugins/voice-loop/scripts/doctor.py' --fail-under=100
          echo "::endgroup::"
          echo "::group::voice-loop speak.py coverage gate (#156 B2 — 100% on the union)"
          python -m coverage report --include='**/plugins/voice-loop/scripts/speak.py' --fail-under=100
          echo "::endgroup::"

          set +e
          python -m coverage report --fail-under="$SHELF_COVERAGE_FLOOR" | tee /tmp/shelf-coverage-report.txt
          report_rc=${PIPESTATUS[0]}
          set -e
          measured=$(awk '$1 == "TOTAL" {print $NF}' /tmp/shelf-coverage-report.txt | tr -d '%')
          [ -n "$measured" ] || { echo "FAIL: coverage report did not produce a TOTAL percentage"; exit 1; }
          echo "shelf coverage: measured=${measured}% floor=${SHELF_COVERAGE_FLOOR}%"
          {
            echo "### Shelf coverage"
            echo
            echo "- Measured: **${measured}%**"
            echo "- Floor: **${SHELF_COVERAGE_FLOOR}%**"
            echo "- Scope: combined statements and branches from the Linux, Windows, and macOS coverage artifacts for voice-loop (4+1+1 legs) and the Ubuntu artifacts for sill-core (4 legs); the voice-loop scripts 100% claims are also asserted against the union in this job's per-scope gates."
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$report_rc" -eq 0 ] || exit "$report_rc"
          # The measured number reaches the publish-coverage-badge job via this job output, so the
          # badge projection can never disagree with the gate that produced it.
          echo "measured=$measured" >> "$GITHUB_OUTPUT"

  # Carved out of `combined-coverage` so the GITHUB_TOKEN that pushes to the unprotected `badges`
  # branch is scoped to THIS job alone — `contents: write` is the only permission it holds. Three
  # guards make it impossible for a badge push to do real harm:
  #   • `needs: combined-coverage` so the publish step is not given a fabricated percentage.
  #   • `github.event_name == 'push' && github.ref == 'refs/heads/main'` so a PR or merge_group
  #     run cannot overwrite the public README's badge with a number main does not have.
  #   • `needs.combined-coverage.result == 'success'` so a failing gate cannot publish a green
  #     for a coverage the gate rejected (the gate itself is the source of truth).
  # The push itself stays non-fatal — a failed push only emits a workflow warning.
  publish-coverage-badge:
    name: publish coverage badge to the badges branch
    runs-on: ubuntu-latest
    needs: [combined-coverage]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.combined-coverage.result == 'success'
    env:
      # Same ratchet value combined-coverage ran the gate against — passed through so the badge
      # reads against the same floor the gate enforced. Keep the two in step: this one only colours
      # the badge, but a badge coloured against a floor the gate did not use is a public lie.
      SHELF_COVERAGE_FLOOR: "100"
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: write the badges JSON and push it to the unprotected badges branch
        env:
          MEASURED: ${{ needs.combined-coverage.outputs.measured }}
        run: |
          set -euo pipefail
          # The artifact is private and expires; shields.io needs an anonymous, durable projection.
          # Push to the dedicated unprotected badges branch — and only here, on a push to main —
          # so a PR or merge_group run cannot overwrite the public README's badge with a number
          # main does not have. The combined .coverage artifact remains the sole source of the
          # measured number; the job output above carries that single value to this job.
          badge_dir="$RUNNER_TEMP/windowsill-badges"
          git fetch origin badges || true
          if git show-ref --verify --quiet refs/remotes/origin/badges; then
            git worktree add "$badge_dir" -B badges origin/badges
          else
            git worktree add --detach "$badge_dir"
            git -C "$badge_dir" switch --orphan badges
            git -C "$badge_dir" rm -rf . >/dev/null 2>&1 || true
          fi
          mkdir -p "$badge_dir/.github"
          badge_tmp="$badge_dir/.github/coverage-badge.json.tmp"
          # The colour projection lives in .github/scripts/coverage_badge.py so a CI step can
          # pin its boundaries on every pull request. The shellcheck job runs that step (see
          # `coverage_badge projection boundaries` below), so the publish step here is not the
          # only place a future floor change could disagree with the rule.
          #
          # Red below the gate floor, yellow for the narrow passing band just above it, green
          # with headroom — and the green threshold is capped at 100 because coverage is a
          # percentage that stops there while `floor + 5` does not. At the floor of 99 this
          # shelf now runs, an uncapped `floor + 5` would put green out of reach: a measured
          # 100% would read yellow on the public README — a warning colour at a perfect score.
          python3 "$GITHUB_WORKSPACE/.github/scripts/coverage_badge.py" write \
            --output "$badge_tmp" \
            --value "$MEASURED" \
            --floor "$SHELF_COVERAGE_FLOOR"
          mv "$badge_tmp" "$badge_dir/.github/coverage-badge.json"
          git -C "$badge_dir" add .github/coverage-badge.json
          if ! git -C "$badge_dir" diff --cached --quiet; then
            git -C "$badge_dir" config user.name "github-actions[bot]"
            git -C "$badge_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C "$badge_dir" commit -m "ci: update coverage badge"
            git -C "$badge_dir" push origin HEAD:badges || echo "::warning::coverage badge push to the badges branch failed; the badge was not updated (non-fatal)"
          fi

  # The ONE context the main-protection ruleset requires (infra#216, the night-wards #1538 pattern):
  # an aggregate that needs every real job and reports on EVERY run — `if: always()` means a failed or
  # skipped dependency still produces this check-run (as a failure), so the required context can never
  # be "missing" and hang a PR or eject a merge-queue group. Matrix jobs publish per-leg display names,
  # which is exactly why the ruleset must not point at them.
  gate:
    name: gate
    runs-on: ubuntu-latest
    needs: [shellcheck, validate, coverage, voice-loop-windows, voice-loop-macos, sill-core-coverage, loopback, combined-coverage]
    if: always()
    steps:
      - name: every needed job succeeded
        # needs-JSON travels as a real env var, never template-substituted into the script text —
        # closes the GHA script-injection class even if a job later grows outputs (lens round, low #1)
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON"
          echo "$NEEDS_JSON" | python3 -c "
          import json, sys
          needs = json.load(sys.stdin)
          bad = {k: v['result'] for k, v in needs.items() if v['result'] != 'success'}
          if bad:
              print('gate: failing because of', bad); sys.exit(1)
          print('gate: all needed jobs succeeded')
          "
