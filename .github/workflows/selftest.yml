name: selftest

# least-privilege floor (infra#216 lens round): nothing in this workflow spends the token
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  # the merge queue runs CI on a merge_group ref; without this trigger the queue's required check
  # would never report and every group would eject at the check-response timeout (infra#216)
  merge_group:
  workflow_dispatch:

jobs:
  shellcheck:
    name: scripts parse and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n every script
        run: for f in plugins/voice-loop/scripts/*.sh; do bash -n "$f" || exit 1; done
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning plugins/voice-loop/scripts/*.sh
      - name: plugin manifests are valid JSON
        run: |
          for f in .claude-plugin/marketplace.json plugins/voice-loop/.claude-plugin/plugin.json \
                   plugins/voice-loop/hooks/hooks.json; do
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f" || exit 1
          done

      - name: selftest.sh argument branches (no server needed)
        run: |
          bash plugins/voice-loop/scripts/selftest.sh --help | grep -q "Usage:" \
            || { echo "--help did not print the usage text"; exit 1; }
          if bash plugins/voice-loop/scripts/selftest.sh --no-such-flag 2>/tmp/selftest-err.txt; then
            echo "an unknown argument was accepted instead of rejected"; exit 1
          fi
          grep -q "unknown argument: --no-such-flag" /tmp/selftest-err.txt \
            || { echo "unknown-arg rejection lost its diagnostic"; cat /tmp/selftest-err.txt; exit 1; }

  coverage:
    name: server unit tests (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # model-free and fast (well under a second of test time), so the version grid is cheap here.
        # The heavy loopback jobs stay single-version per OS.
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: install test dependencies (no models, no network at test time)
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r plugins/voice-loop/tests/requirements.txt
      # Each plugin owns its test run: pytest.ini and .coveragerc live in the plugin directory and
      # their paths (testpaths, pythonpath, coverage source) are relative to it, so the suite is
      # invoked from there rather than from the repo root.
      - name: pytest with a hard 100% coverage gate
        working-directory: plugins/voice-loop
        run: pytest --cov=voice_server --cov-report=term-missing --cov-fail-under=100

  loopback:
    name: loopback selftest (${{ matrix.os }}, ${{ matrix.language }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Two lanes, two languages: Russian exercises the accentuation pipeline on Linux, English
          # exercises the macOS adapter path — English is a first-class language, not a fallback.
          - os: ubuntu-latest
            accent: "1"
            language: ru
            hook_phrase: Проверка озвучки завершена. Потоковый синтез работает. Контур замкнут и отвечает.
          - os: macos-latest
            accent: "0"
            language: en
            hook_phrase: Speech check complete. The streaming path is live. The loop hears itself and answers.
    env:
      VOICE_LOOP_STT_MODEL: small
      VOICE_LOOP_LANGUAGE: ${{ matrix.language }}
      VOICE_LOOP_DEVICE: cpu
      VOICE_LOOP_ACCENT: ${{ matrix.accent }}
      HF_HOME: ${{ github.workspace }}/.cache/hf
      TORCH_HOME: ${{ github.workspace }}/.cache/torch
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: system audio libraries
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq libsndfile1 jq
          else
            brew install libsndfile jq
          fi

      - name: cache speech models
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache
          key: models-${{ matrix.os }}-${{ matrix.language }}-${{ env.VOICE_LOOP_STT_MODEL }}-v1

      - name: install server dependencies
        run: |
          python -m pip install --upgrade pip
          if [ "$RUNNER_OS" = "Linux" ]; then
            pip install --index-url https://download.pytorch.org/whl/cpu torch
          fi
          pip install -r plugins/voice-loop/server/requirements.txt

      - name: prefetch models for this lane's language (cached across runs)
        run: |
          python - <<'PY'
          import os, sys, torch
          sys.path.insert(0, "plugins/voice-loop/server")
          from voice_server import SILERO_VOICES
          from faster_whisper import WhisperModel

          language = os.environ["VOICE_LOOP_LANGUAGE"]
          silero_language, model_id, speaker = SILERO_VOICES[language]
          print(f"prefetching whisper + silero {model_id} ({silero_language}, {speaker}) for {language}")
          WhisperModel(os.environ["VOICE_LOOP_STT_MODEL"], device="cpu", compute_type="int8")
          torch.hub.load(
              "snakers4/silero-models", "silero_tts",
              language=silero_language, speaker=model_id, trust_repo=True,
          )
          PY

      - name: start the server
        run: |
          python plugins/voice-loop/server/voice_server.py &
          echo $! > /tmp/voice-loop.pid
          # `if` keeps a failing poll from tripping the step's `set -e` while the server warms up
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8355/health; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8355/health

      - name: loopback selftest (TTS -> STT -> compare)
        run: |
          bash plugins/voice-loop/scripts/selftest.sh \
            --endpoint http://127.0.0.1:8355 \
            --language "$VOICE_LOOP_LANGUAGE" \
            --strict --threshold 0.7

      - name: Stop-hook contract (real invocation, no speakers)
        env:
          PHRASE: ${{ matrix.hook_phrase }}
          LANGUAGE: ${{ matrix.language }}
        run: |
          mkdir -p "$HOME/.config/voice-loop"
          cat > "$HOME/.config/voice-loop/config.json" <<JSON
          {
            "language": "$LANGUAGE",
            "tts": { "backend": "lan", "endpoint": "http://127.0.0.1:8355" },
            "speak": { "marker": "🔊", "player": "true", "timeout": 180, "max_chars": 4000 }
          }
          JSON
          # The server merges sentence chunks up to MAX_TTS_CHARS (800) per SSE chunk, so a
          # multi-chunk stream needs >800 chars of marked text: the phrase is repeated past that
          # (and speak.max_chars raised above its 600 default) so chunks>1 below proves real
          # multi-event SSE streaming, not a single-chunk degenerate stream.
          LONG_PHRASE=$(python3 -c 'import os
          p = os.environ["PHRASE"]
          s = p
          while len(s) <= 820:
              s = s + " " + p
          print(s)')
          export LONG_PHRASE
          python3 -c 'import json, os; print(json.dumps({"type": "assistant", "message": {"content": [{"type": "text", "text": "a plain line that must NOT be spoken\n\U0001F50A " + os.environ["LONG_PHRASE"]}]}}))' > /tmp/transcript.jsonl
          printf '%s' '{"transcript_path": "/tmp/transcript.jsonl"}' | bash plugins/voice-loop/scripts/speak.sh
          state="${XDG_STATE_HOME:-$HOME/.local/state}/voice-loop"
          echo "--- speak.log"; cat "$state/speak.log"
          grep -qF "$PHRASE" "$state/last-spoken" || { echo "marker extraction failed"; exit 1; }
          if grep -q "plain line" "$state/last-spoken"; then echo "an unmarked line was spoken"; exit 1; fi
          grep -q "played rc=0" "$state/speak.log" || { echo "synthesis/playback path failed"; exit 1; }
          played_line=$(grep "played rc=" "$state/speak.log" | tail -n 1)
          printf '%s\n' "$played_line" | grep -q "via=stream" \
            || { echo "playback did not go via SSE streaming (via=stream missing) -- the stream silently regressed to the blob /tts fallback"; exit 1; }
          chunks=$(printf '%s\n' "$played_line" | sed -n 's/.*chunks=\([0-9][0-9]*\).*/\1/p')
          [ "${chunks:-0}" -gt 1 ] \
            || { echo "expected a multi-chunk stream (chunks>1), got chunks=${chunks:-none} -- the marked text no longer spans multiple server chunks"; exit 1; }

      - name: eager-speaking contract (real invocation — ledger, seeding, lock)
        env:
          PHRASE: ${{ matrix.hook_phrase }}
          LANGUAGE: ${{ matrix.language }}
        run: |
          # The eager subsystem's real-process proof, against the SAME live server the Stop-hook
          # step above used: the PostToolUse firing, first-run seeding, the spoken-ledger that makes
          # the two event paths idempotent with each other, and the non-blocking inter-firing lock.
          # It is set BESIDE that step rather than layered onto it — a SECOND config file turns
          # speak.eager on without touching the default-off one whose behaviour the step above
          # pinned, and a SECOND state dir keeps this step's speak.log countable: every
          # "played rc=0" line in it is one of ours, so "spoken exactly once" is a number, not a
          # grep that could be satisfied by an earlier step's line.
          export VOICE_LOOP_CONFIG="$RUNNER_TEMP/eager-config.json"
          export XDG_STATE_HOME="$RUNNER_TEMP/eager-state"
          export TRANSCRIPT="$RUNNER_TEMP/eager-transcript.jsonl"
          state="$XDG_STATE_HOME/voice-loop"
          log="$state/speak.log"
          ledger="$state/spoken.ledger"

          # A player that takes real time to "play", as a real one does. The speaking lock is held
          # for the whole read-claim-speak-PLAY sequence, so an instant no-op player would leave the
          # concurrency check below racing an already-finished process instead of a speaking one.
          cat > "$RUNNER_TEMP/slow-player" <<'SH'
          #!/usr/bin/env bash
          sleep 0.5
          SH
          chmod +x "$RUNNER_TEMP/slow-player"

          cat > "$VOICE_LOOP_CONFIG" <<JSON
          {
            "language": "$LANGUAGE",
            "tts": { "backend": "lan", "endpoint": "http://127.0.0.1:8355" },
            "speak": {
              "marker": "🔊", "player": "$RUNNER_TEMP/slow-player", "timeout": 180, "eager": true
            }
          }
          JSON

          cat > "$RUNNER_TEMP/append.py" <<'PY'
          # one assistant message appended to the transcript, in the shape speak.py reads
          import json, os, sys

          rec = {"type": "assistant", "message": {"content": [{"type": "text", "text": sys.argv[1]}]}}
          with open(os.environ["TRANSCRIPT"], "a", encoding="utf-8") as fh:
              fh.write(json.dumps(rec) + "\n")
          PY
          cat > "$RUNNER_TEMP/payload.py" <<'PY'
          # the hook payload the harness puts on stdin — hook_event_name is what picks the path
          import json, os, sys

          print(json.dumps({"transcript_path": os.environ["TRANSCRIPT"], "hook_event_name": sys.argv[1]}))
          PY

          # Three short sentences off this lane's OWN phrase: real speech in the lane's language,
          # one quick synthesis each, and each short enough to appear whole in the log's `text:`
          # line (which is clipped at 80 characters).
          A=$(python3 -c 'import os; print(os.environ["PHRASE"].split(".")[0].strip() + ".")')
          B=$(python3 -c 'import os; print(os.environ["PHRASE"].split(".")[1].strip() + ".")')
          C=$(python3 -c 'import os; print(os.environ["PHRASE"].split(".")[2].strip() + ".")')
          # `grep -c` exits 1 on zero matches, which would trip the step's `set -e` before the
          # assertion could report it — the count itself is the answer we want, so keep it.
          played() { grep -c "played rc=0" "$log" 2>/dev/null || true; }
          said() { grep -c -F "text: $1" "$log" 2>/dev/null || true; }
          claims() { grep -c -v '^seeded:' "$ledger" 2>/dev/null || true; }
          fire() { python3 "$RUNNER_TEMP/payload.py" "$1" | bash plugins/voice-loop/scripts/speak.sh; }

          # (1) FIRST RUN — a transcript nobody has spoken for is HISTORY, not news: its marked line
          # goes into the ledger WITHOUT being spoken. Turning eager on mid-session must not recite
          # the session back, which is exactly what the live deployment did.
          python3 "$RUNNER_TEMP/append.py" "🔊 $C"
          fire PostToolUse
          echo "--- speak.log after the seeding firing"; cat "$log"
          grep -q "seeded 1 line(s) of history" "$log" \
            || { echo "the first eager firing did not write this transcript off as history"; exit 1; }
          [ "$(played)" -eq 0 ] || { echo "the seeding firing recited history back at us"; exit 1; }
          [ -s "$ledger" ] || { echo "no spoken.ledger was written"; exit 1; }
          [ "$(claims)" -eq 1 ] \
            || { echo "the seeded line was not claimed: $(claims) key(s)"; cat "$ledger"; exit 1; }

          # (2) EAGER SPEAKS MID-TURN — a marked line appears, a tool call fires PostToolUse, and it
          # is spoken there and then. This is the whole reason the event path exists.
          python3 "$RUNNER_TEMP/append.py" "🔊 $A"
          fire PostToolUse
          echo "--- speak.log after the eager firing"; cat "$log"
          [ "$(played)" -eq 1 ] \
            || { echo "PostToolUse did not speak the fresh line (played rc=0 count: $(played))"; exit 1; }
          [ "$(said "$A")" -eq 1 ] || { echo "the eager firing spoke something other than the fresh line"; exit 1; }
          [ "$(said "$C")" -eq 0 ] || { echo "the seeded history line was spoken after all"; exit 1; }
          [ "$(claims)" -eq 2 ] \
            || { echo "the spoken line was not claimed in the ledger"; cat "$ledger"; exit 1; }

          # (3) THE LEDGER ACROSS EVENTS — Stop's scope IS that same last message, so without the
          # ledger it would say again what eager just said. It must stay quiet; and it must still
          # speak a line that lands after the final tool call, which no eager firing ever saw.
          fire Stop
          [ "$(played)" -eq 1 ] || { echo "Stop re-spoke the line eager had already spoken"; exit 1; }
          [ "$(said "$A")" -eq 1 ] || { echo "Stop re-extracted the already-claimed line"; exit 1; }
          python3 "$RUNNER_TEMP/append.py" "🔊 $B"
          fire Stop
          echo "--- speak.log after both Stop firings"; cat "$log"
          [ "$(played)" -eq 2 ] || { echo "Stop did not speak the closing line eager never saw"; exit 1; }
          [ "$(said "$B")" -eq 1 ] || { echo "the closing line was not the one spoken"; exit 1; }

          # (4) THE LOCK, FOR REAL — two firings launched back to back over one fresh line. The
          # acquire is NON-BLOCKING, so the loser must bow out at once leaving its line unclaimed:
          # exactly ONE of the two speaks, and nobody queues up behind the speaker. (Which of the
          # two wins is the scheduler's business; the assertion is symmetric in them.)
          python3 "$RUNNER_TEMP/append.py" "🔊 $PHRASE"
          fire PostToolUse & first=$!
          fire PostToolUse & second=$!
          wait "$first"
          wait "$second"
          echo "--- speak.log after the concurrent pair"; cat "$log"
          [ "$(played)" -eq 3 ] \
            || { echo "expected exactly one more played line from the pair (3 in all), got $(played)"; exit 1; }
          [ "$(grep -c 'line left unclaimed' "$log" 2>/dev/null || true)" -eq 1 ] \
            || { echo "the losing firing did not bow out non-blockingly and leave its line unclaimed"; exit 1; }
          echo "--- spoken.ledger"; cat "$ledger"

      - name: dictation contract (real invocation, no microphone)
        env:
          PHRASE: ${{ matrix.hook_phrase }}
          LANGUAGE: ${{ matrix.language }}
        run: |
          # Exercises dictate.py's real record -> STT -> clipboard path headlessly, against the
          # same live server. The microphone is faked through dictate's own config seams:
          # dictate.recorder pins the recorder table's "pw-record" entry, whose executable is a
          # PATH-shadowing script that "records" by copying a server-TTS-rendered clip of the
          # phrase (real speech, so STT has something to hear) and then waits for dictate's
          # stop signal; dictate.clipboard pins "wl-copy", shadowed by a script capturing stdin.
          fake="$RUNNER_TEMP/dictate-fake"
          mkdir -p "$fake"
          export FAKE_RECORD_WAV="$RUNNER_TEMP/dictate-source.wav"
          export FAKE_CLIP_FILE="$RUNNER_TEMP/dictate-clip.txt"
          body=$(python3 -c 'import json, os; print(json.dumps({"text": os.environ["PHRASE"], "language": os.environ["LANGUAGE"]}))')
          curl -fsS --noproxy '*' -m 180 -o "$FAKE_RECORD_WAV" -X POST http://127.0.0.1:8355/tts \
            -H 'Content-Type: application/json' --data "$body"
          [ "$(head -c 4 "$FAKE_RECORD_WAV")" = "RIFF" ] \
            || { echo "TTS did not return a WAV for the fake microphone"; exit 1; }
          cat > "$fake/pw-record" <<'SH'
          #!/usr/bin/env bash
          # fake microphone: "record" by copying pre-synthesized speech, then wait to be stopped
          wav=""
          for arg in "$@"; do wav="$arg"; done
          cp "${FAKE_RECORD_WAV:?}" "${wav:?}"
          exec sleep 60
          SH
          cat > "$fake/wl-copy" <<'SH'
          #!/usr/bin/env bash
          # fake clipboard: capture stdin (dictate fills both the clipboard and primary selections)
          cat >> "${FAKE_CLIP_FILE:?}"
          SH
          chmod +x "$fake/pw-record" "$fake/wl-copy"
          export VOICE_LOOP_CONFIG="$RUNNER_TEMP/dictate-config.json"
          cat > "$VOICE_LOOP_CONFIG" <<JSON
          {
            "language": "$LANGUAGE",
            "stt": { "backend": "lan", "endpoint": "http://127.0.0.1:8355" },
            "dictate": { "recorder": "pw-record", "clipboard": "wl-copy" }
          }
          JSON
          export PATH="$fake:$PATH"
          python3 plugins/voice-loop/scripts/dictate.py paste   # toggle 1: start the fake recorder
          sleep 1
          python3 plugins/voice-loop/scripts/dictate.py paste   # toggle 2: stop -> STT -> clipboard
          state="${XDG_STATE_HOME:-$HOME/.local/state}/voice-loop"
          echo "--- dictate.log"; cat "$state/dictate.log"
          echo "--- clipboard capture"; cat "$FAKE_CLIP_FILE" 2>/dev/null || true; echo
          grep -q "recording via pw-record" "$state/dictate.log" \
            || { echo "the fake recorder was never started"; exit 1; }
          if grep -q "clip too short" "$state/dictate.log"; then
            echo "the recorded clip was dropped by the min-clip guard"; exit 1
          fi
          if grep -q "empty transcription" "$state/dictate.log"; then
            echo "STT returned no text for the recorded speech"; exit 1
          fi
          grep -q "transcript: " "$state/dictate.log" \
            || { echo "no transcript was logged"; exit 1; }
          if grep -q -e "unexpected error" -e "Traceback" "$state/dictate.log"; then
            echo "dictate hit an error path"; exit 1
          fi
          [ -s "$FAKE_CLIP_FILE" ] \
            || { echo "the transcript never reached the clipboard"; exit 1; }

      - name: server log on failure
        if: failure()
        run: kill "$(cat /tmp/voice-loop.pid)" 2>/dev/null || true

  # The ONE context the main-protection ruleset requires (infra#216, the night-wards #1538 pattern):
  # an aggregate that needs every real job and reports on EVERY run — `if: always()` means a failed or
  # skipped dependency still produces this check-run (as a failure), so the required context can never
  # be "missing" and hang a PR or eject a merge-queue group. Matrix jobs publish per-leg display names,
  # which is exactly why the ruleset must not point at them.
  gate:
    name: gate
    runs-on: ubuntu-latest
    needs: [shellcheck, coverage, loopback]
    if: always()
    steps:
      - name: every needed job succeeded
        # needs-JSON travels as a real env var, never template-substituted into the script text —
        # closes the GHA script-injection class even if a job later grows outputs (lens round, low #1)
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON"
          echo "$NEEDS_JSON" | python3 -c "
          import json, sys
          needs = json.load(sys.stdin)
          bad = {k: v['result'] for k, v in needs.items() if v['result'] != 'success'}
          if bad:
              print('gate: failing because of', bad); sys.exit(1)
          print('gate: all needed jobs succeeded')
          "
