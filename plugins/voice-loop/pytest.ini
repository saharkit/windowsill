# This plugin owns its own test run. Paths are relative to this file's directory, so the suite is
# invoked from here (`cd plugins/voice-loop && pytest …`), never from the repo root.
[pytest]
testpaths = tests
# `server` is where voice_server lives; `scripts` is there for ONE module — providers.py, the
# provider registry the three scripts import. The scripts themselves are still loaded by
# spec_from_file_location (they are files with a dash-free name by accident, not a package), and
# that loader does NOT put their directory on sys.path, so a bare `import providers` inside
# dictate.py would be a collection-time ModuleNotFoundError without this line. At RUNTIME the same
# import resolves for free: the launchers exec `python3 <dir>/dictate.py`, so sys.path[0] is
# scripts/ already.
pythonpath = server scripts
addopts = -q
# A test that HANGS is a test that never reports. The gate tests drive a capacity-1 semaphore, so a
# regression in the release-before-retry property would block forever rather than fail; those carry
# their own tight @pytest.mark.timeout, and this modest global ceiling catches every other way a
# future test could wedge (a stuck thread, an unbounded wait) with a named error instead of a run
# that hangs until CI kills the job. Nothing here touches the network or a model — a case still
# running after 30 seconds is already broken.
timeout = 30
filterwarnings =
    error::DeprecationWarning:voice_server
