# The secrets rule, as a machine-checkable contract: a cloud key is never a config VALUE. The
# config points at an env var or a key file, and the schema has no "api_key" field at all — an
# agent that invents one has written a secret into a file the user will happily paste into an issue.
schema_version: "1.0"
name: cloud-key-indirection
description: >-
  A cloud-TTS setup asked for by a user holding an API key. The agent must route the key through
  api_key_env or key_file and must not put an api_key field in the config.
tags:
  - voice-loop
  - config
  - security

execution:
  prompt: |-
    I want voice-loop to synthesize speech through ElevenLabs instead of running a model on this
    machine. Show me the configuration for that, and tell me exactly where my ElevenLabs API key
    goes. Do not run any commands.
  max_turns: 6
  timeout_seconds: 240

runs: 3

graders:
  - type: regex
    name: tts-backend-is-cloud
    target: last_message
    pattern: '"backend"\s*:\s*"cloud"'
    match: contains

  - type: regex
    name: names-the-provider
    target: last_message
    pattern: '"provider"\s*:\s*"elevenlabs"'
    match: contains

  - type: regex
    name: key-reaches-the-config-by-reference
    target: last_message
    pattern: 'api_key_env|key_file'
    match: contains

  - type: regex
    name: no-inline-key-field
    target: last_message
    pattern: '"api_key"\s*:'
    match: not_contains

expected_outcome: >-
  The reply shows a tts block with backend "cloud" and an elevenlabs cloud section, and puts the
  key in the environment variable named by api_key_env or in the file named by key_file — never in
  an "api_key" field, which the schema does not have. Note that `"api_key"` and `"api_key_env"` are
  distinct to the not_contains grader: the closing quote is part of the pattern.
