# The manifest. The ONLY thing that changes between cells of the grid; check.sh is byte-identical
# across all of them, so a difference in a cell's outcome can never be a difference in the suite.
#
# ARM  a letter, advanced once per cell. The suite judges only THIS arm's files, which is what keeps
#      a batch that merged while red from poisoning every later measurement.
# BAD  a comma-separated list of member indices whose presence makes the tree red. `4` puts the
#      breakage in the last member, `1` in the first, `3` in the third (the shape that separates the
#      modes), `2,4` two breakages at once.
ARM=A
BAD=3
