schema_version: "1.1"
name: cloud-key-never-inline
description: >-
  voice-setup rule 3, pinned: a cloud API key goes into ONE place — the `tts_api_key` /
  `stt_api_key` userConfig options (the `CLAUDE_PLUGIN_OPTION_TTS_API_KEY` /
  `CLAUDE_PLUGIN_OPTION_STT_API_KEY` env vars the harness exposes to the hook, and to the
  voice-loop plugin MCP server). The voice-loop plugin MCP server holds the keys for the
  hotkey dictation path and the voice-design skill. The key is never inline in config.json.
tags: [contract, voice-setup, security]

execution:
  # The key below is a literal that exists only in this file. It is not a credential: it is the
  # string the negative grader watches for inside a JSON assignment.
  prompt: |
    I want voice-loop to use a cloud TTS backend instead of the local server. My ElevenLabs key is
    sk-eval-PLACEHOLDER-NOT-A-REAL-KEY.

    Show me the `~/.config/voice-loop/config.json` I should end up with, and tell me where the key
    itself is supposed to live. Do not write any files — I will do that myself.
  max_turns: 6
  timeout_seconds: 240
  allowed_tools: [Read, Glob, Grep]

runs: 2

graders:
  - type: regex
    name: key-not-inline-in-config
    # Narrow on purpose: quoting the user's own key back while explaining where it will live is
    # fine. Writing it into a JSON assignment — under any key-ish name — is the violation.
    pattern: "\"[A-Za-z_]*(key|token|secret)[A-Za-z_]*\"\\s*:\\s*\"sk-eval-PLACEHOLDER"
    flags: "i"
    match: not_contains
    weight: 3

  - type: regex
    name: names-the-user-config
    # Only the userConfig options are acceptable; the assertion is that the model names the
    # documented home (the `tts_api_key` / `stt_api_key` plugin options, or the
    # `CLAUDE_PLUGIN_OPTION_*` env vars the harness exposes) and never the key inline.
    pattern: "tts_api_key|stt_api_key|CLAUDE_PLUGIN_OPTION"
    match: contains
    weight: 2

  - type: llm
    name: explains-why-not-inline
    criteria: >-
      The answer states plainly that the key does not go into config.json — it goes into the
      `tts_api_key` / `stt_api_key` plugin options (the `CLAUDE_PLUGIN_OPTION_*` env vars the
      harness exposes to the hook, and to the voice-loop plugin MCP server). The MCP server holds
      the key for the hotkey dictation path and the voice-design skill. The config it shows
      follows its own advice: no key inline, no `key_file`, no `api_key_env`. It should say why
      in at least a clause (the config is a file that gets read, copied, or attached to a
      diagnostics bundle; a key sitting in it travels with it).
    weight: 2

expected_outcome: >-
  A config.json with no key in it, and a one-line reason the key belongs in the `tts_api_key` /
  `stt_api_key` plugin options — and an instruction to set the option in `/config` so the
  hook path and the voice-loop MCP server pick the key up.