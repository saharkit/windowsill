# This plugin owns its own test run. Paths are relative to this file's directory, so the suite is
# invoked from here (`cd plugins/sill-core && pytest …`), never from the repo root.
[pytest]
testpaths = tests
pythonpath = .
addopts = -q
# A test that HANGS is a test that never reports.  The concurrent-write test spawns real processes
# that should complete in well under 30 s; a hung subprocess or a deadlocked gate would wedge here.
timeout = 30
filterwarnings =
    error::DeprecationWarning:sill_core
