# The one thing the unit suite structurally cannot check.
#
# `tests/` fakes the `from TTS.api import TTS` and `from ukrainian_tts.tts import TTS` seams on
# purpose — no models, no network, no 2 GB of wheels — so a 100% green suite says nothing about
# whether the optional-engine installs we DOCUMENT still work. XTTS stopped working upstream without
# a line of this repo changing (#34): coqui-tts declares neither torch nor torchaudio yet imports
# torchaudio, an unresolved transformers moved to 5.x and dropped `isin_mps_friendly`, and torch>=2.9
# wants torchcodec wheels that need CUDA libraries or a system ffmpeg. These jobs install the
# documented recipes into a clean venv and import them for real, once a week, so the next upstream
# break is a red run instead of a stranger's ruined evening.
#
# Deliberately NOT on every push/PR: ~3 minutes of wheel downloads is worth paying weekly, not per
# commit. Deliberately NO model download either — COQUI_TOS_AGREED is unset and nothing calls the
# models, so neither the CPML-licensed XTTS weights nor the ukrainian-tts voices are ever fetched.
# The import (and, for ukrainian-tts, the API surface the server fakes) is the whole contract.
#
# When the xtts job goes red: the recipe drifted. Fix the pins in BOTH server/requirements.txt (the
# [xtts] comment block) and server/README.md → "XTTS engine", and here. When the ukrainian job goes
# red: the package changed the API the server calls — check UKRAINIAN_VOICES / UKRAINIAN_STRESS /
# UKRAINIAN_SR and the ukrainian_pieces() call against the new package.
name: tts engine install probes

on:
  schedule:
    - cron: "17 5 * * 1" # Mondays, 05:17 UTC
  workflow_dispatch:

jobs:
  install:
    name: the documented XTTS install still installs and imports
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: the pins here and the ones we document are the same pins
        run: |
          # Three places quote this recipe: the requirements comment block, the README section, and
          # the refusal the server hands a user whose coqui-tts cannot import (#35). All three drift
          # together or not at all.
          for f in plugins/voice-loop/server/requirements.txt \
                   plugins/voice-loop/server/README.md \
                   plugins/voice-loop/server/voice_server.py; do
            grep -q "torch==2.8.0 torchaudio==2.8.0" "$f" \
              || { echo "$f no longer documents the torch/torchaudio pins this probe installs"; exit 1; }
            grep -q "transformers<5" "$f" \
              || { echo "$f no longer documents the transformers pin this probe installs"; exit 1; }
          done

      - name: install the documented recipe into a clean venv (CPU index)
        run: |
          python3 -m venv /tmp/xtts-probe
          /tmp/xtts-probe/bin/pip install --upgrade pip
          /tmp/xtts-probe/bin/pip install --index-url https://download.pytorch.org/whl/cpu \
            torch==2.8.0 torchaudio==2.8.0
          /tmp/xtts-probe/bin/pip install 'transformers<5' coqui-tts

      - name: what actually resolved
        run: /tmp/xtts-probe/bin/pip list | grep -Ei "^(torch|torchaudio|torchcodec|transformers|coqui-tts|TTS) "

      - name: import it for real (no model download — the weights stay untouched)
        run: /tmp/xtts-probe/bin/python -c "from TTS.api import TTS; print('xtts import ok')"

  ukrainian-install:
    name: the documented ukrainian-tts install still installs and exposes the API the server fakes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install the documented recipe into a clean venv (CPU torch/torchaudio first)
        run: |
          python3 -m venv /tmp/ukrainian-probe
          /tmp/ukrainian-probe/bin/pip install --upgrade pip
          /tmp/ukrainian-probe/bin/pip install --index-url https://download.pytorch.org/whl/cpu torch torchaudio
          /tmp/ukrainian-probe/bin/pip install ukrainian-tts
          # 6.0.2 hard-pins ukrainian-word-stress==1.1.0, downgrading the >=2.0 the server needs —
          # the documented recipe's last step puts it back (pip warns about the pin; that is expected)
          /tmp/ukrainian-probe/bin/pip install 'ukrainian-word-stress>=2.0'

      - name: what actually resolved
        run: /tmp/ukrainian-probe/bin/pip list | grep -Ei "^(torch|torchaudio|ukrainian-tts|ukrainian-word-stress) "

      - name: import it and pin the API surface the server calls (no model download)
        run: |
          /tmp/ukrainian-probe/bin/python - <<'EOF'
          import inspect
          from ukrainian_tts.tts import TTS, Voices, Stress

          # The server's UKRAINIAN_VOICES / UKRAINIAN_STRESS constants and the positional
          # model.tts(text, voice, stress, buffer) call in ukrainian_pieces() are this contract;
          # constructing TTS() would download the voices, so the signature stands in for the call.
          assert Stress.Dictionary.value == "dictionary", list(Stress)
          assert {voice.value for voice in Voices} >= {"tetiana", "mykyta", "lada"}, list(Voices)
          sig = inspect.signature(TTS.tts)
          params = list(sig.parameters)
          # The call is POSITIONAL, so the honest contract is the arity, the first four names, and
          # a 5th parameter that takes the writable buffer by position — its NAME is upstream's
          # own business (6.0.2 says output_fp; earlier releases said file). A rename that keeps
          # the position breaks nothing the server does and must not red this probe; a positional
          # change — a reorder, an insertion, the buffer going keyword-only — still must.
          assert params[:4] == ["self", "text", "voice", "stress"], params
          assert len(params) >= 5 and params[4] in ("file", "output_fp"), params
          assert sig.parameters[params[4]].kind is inspect.Parameter.POSITIONAL_OR_KEYWORD, params
          print("ukrainian-tts import ok; the API surface matches what the server fakes")
          EOF
